<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모두의 건설안전 — 스킬트리</title>
<link rel="stylesheet" href="css/base.css">
<meta name="theme-color" content="#08090B">
<style>
/* 스킬트리 — 학습 단위는 **테마**다.
   등급은 누적 커버리지로 매긴 것이라, 위에서부터 치면 기출이 빠르게 덮인다.
   그 사실을 화면 맨 위에 숫자로 박는다. 진도율보다 "얼마나 덮었나"가 동기다. */
body{margin:0}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:21px;margin:2px 0 3px;letter-spacing:-.02em;color:var(--ink)}
.sub{font-size:12.5px;color:var(--ink-4);margin:0 0 16px}

.cover{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:8px}
.cover .big{display:flex;align-items:baseline;gap:9px}
.cover .big em{font-style:normal;font-size:30px;font-weight:900;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.cover .big span{font-size:13px;color:var(--ink-3)}
.bar{height:11px;border-radius:6px;background:var(--bg-2);overflow:hidden;display:flex;margin-top:11px;
  border:1px solid var(--line)}
.bar i{display:block;height:100%}
.leg{display:flex;gap:11px;margin-top:9px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.leg b{font-weight:800;color:var(--ink-2)}
.leg span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.lS:before{background:#ff3b30}.lA:before{background:#ff8f0a}.lB:before{background:#3d7dff}.lC:before{background:#5b6472}

.next{background:linear-gradient(135deg,#2a0f10,#150a0b);border:1px solid #4a1c1e;border-radius:14px;
  padding:15px;margin:8px 0 22px}
.next b{display:block;font-size:10px;letter-spacing:.15em;color:#ff6b60;font-weight:900;margin-bottom:9px}
.next a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;padding:7px 0}
.next a+a{border-top:1px solid rgba(255,255,255,.06)}
.next .nm{flex:1;min-width:0}
.next .nm i{display:block;font-style:normal;font-size:15px;font-weight:800;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .nm s{display:block;text-decoration:none;font-size:11.5px;color:#c99}
.next .go{font-size:12px;font-weight:800;color:#fff;background:var(--red);border-radius:8px;padding:6px 11px}

.subj{margin-top:26px}
.subjhd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.subjhd h2{font-size:16px;margin:0;color:var(--ink);letter-spacing:-.01em}
.subjhd span{font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.grp{font-size:10.5px;letter-spacing:.14em;color:var(--ink-4);font-weight:900;margin:16px 0 8px}

.card{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  margin-bottom:7px;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.card .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,59,48,.10);pointer-events:none}
.card .bd{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;color:#fff;position:relative;z-index:1}
.S{background:#ff3b30}.A{background:#ff8f0a}.B{background:#3d7dff}.C{background:#5b6472}
.card .tx{position:relative;z-index:1;min-width:0}
.card .tx b{display:block;font-size:14.5px;color:var(--ink);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tx small{display:block;font-size:11px;color:var(--ink-4);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rt{position:relative;z-index:1;text-align:right;font-variant-numeric:tabular-nums}
.card .rt em{display:block;font-style:normal;font-size:13px;font-weight:800;color:var(--ink-2)}
.card .rt s{display:block;text-decoration:none;font-size:10px;color:var(--ink-4);margin-top:1px}
.done .tx b{color:var(--ink-3)}
.dot{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--red);
  margin-left:6px;vertical-align:middle}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;background:var(--surface);border-top:1px solid var(--line)}
.tabs a{padding:12px 0;text-align:center;font-size:11.5px;color:var(--ink-4);text-decoration:none;font-weight:700}
.tabs a.on{color:var(--red-2)}
</style></head><body>
<div class="wrap">
  <h1>스킬트리</h1>
  <p class="sub" id="sub"></p>

  <div class="cover">
    <div class="big"><em id="pct">0%</em><span id="pctsub"></span></div>
    <div class="bar" id="bar"></div>
    <div class="leg" id="leg"></div>
  </div>

  <div class="next" id="next"></div>
  <div id="list"></div>
</div>
<nav class="tabs" id="tabs"></nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  var 테마=(G.테마||[]), 문항테마=(G.문항테마||{}), 강의=(G.강의||{});
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  /* 탭 — 실기가 있는 종목만 5칸 */
  var 실기있음=!!(G.실기&&G.실기.유형&&G.실기.유형.length);
  var 탭=[['index.html','오늘'],['study.html','문제'],['skilltree.html','스킬트리']];
  if(실기있음) 탭.push(['practical.html','실기']);
  탭.push(['settings.html','설정']);
  var tb=document.getElementById('tabs');
  tb.style.gridTemplateColumns='repeat('+탭.length+',1fr)';
  tb.innerHTML=탭.map(function(t){
    return '<a href="'+t[0]+'"'+(t[1]==='스킬트리'?' class="on"':'')+'>'+t[1]+'</a>';}).join('');

  /* 테마별 푼 문항 세기 — 진도가 아니라 **정복도**다 */
  var 푼것=(window.S&&S.푼것)||{};
  var 맞힘={}, 풀이={};
  Object.keys(푼것).forEach(function(id){
    var k=문항테마[id]; if(!k) return;
    풀이[k]=(풀이[k]||0)+1;
    if(푼것[id] && 푼것[id].o) 맞힘[k]=(맞힘[k]||0)+1;
  });

  var 총문항=테마.reduce(function(a,t){return a+t.c;},0)||1;
  var 덮은=0;
  테마.forEach(function(t){ 덮은 += Math.min(맞힘[t.k]||0, t.c); });
  document.getElementById('pct').textContent=Math.round(덮은*100/총문항)+'%';
  document.getElementById('pctsub').textContent=
    '기출 '+총문항.toLocaleString()+'문항 중 '+덮은.toLocaleString()+'문항 정복';
  document.getElementById('sub').textContent=
    테마.length+'개 테마. 위에 있는 것부터 치면 기출이 가장 빨리 덮입니다.';

  var 색={S:'#ff3b30',A:'#ff8f0a',B:'#3d7dff',C:'#5b6472'}, 몫={S:0,A:0,B:0,C:0};
  테마.forEach(function(t){ 몫[t.g]=(몫[t.g]||0)+t.c; });
  document.getElementById('bar').innerHTML=['S','A','B','C'].map(function(g){
    return 몫[g]? '<i style="width:'+(몫[g]*100/총문항)+'%;background:'+색[g]+'"></i>':'';}).join('');
  document.getElementById('leg').innerHTML=['S','A','B','C'].map(function(g){
    var n=테마.filter(function(t){return t.g===g;}).length;
    return '<span class="l'+g+'"><b>'+g+'</b> '+n+'테마 · 기출 '+Math.round(몫[g]*100/총문항)+'%</span>';
  }).join('');

  /* 다음에 칠 곳 — 등급 높고 아직 안 친 것 */
  var 후보=테마.filter(function(t){ return (맞힘[t.k]||0) < t.c*0.6; })
    .sort(function(a,b){
      var 순={S:0,A:1,B:2,C:3};
      return (순[a.g]-순[b.g]) || (b.f-a.f);
    }).slice(0,3);
  document.getElementById('next').innerHTML='<b>다음은 여기입니다</b>'+후보.map(function(t){
    var 갈곳=강의[t.k]? 'lecture.html?code='+encodeURIComponent(t.k)
                      : 'study.html?code='+encodeURIComponent(t.k);
    return '<a href="'+갈곳+'"><span class="bd '+t.g+'" style="width:30px;height:30px;'+
      'border-radius:9px;display:flex;align-items:center;justify-content:center;'+
      'font-weight:900;font-size:12px;color:#fff;background:'+색[t.g]+'">'+t.g+'</span>'+
      '<span class="nm"><i>'+esc(t.n)+'</i><s>회차당 '+t.f+'문항 · '+t.c+'문항'+
      (강의[t.k]?' · 강의 있음':'')+'</s></span>'+
      '<span class="go">'+(강의[t.k]?'강의':'풀기')+'</span></a>';
  }).join('');

  /* 과목 → 등급 순 테마 */
  var 과목순=[], 묶음={};
  테마.forEach(function(t){
    if(!묶음[t.s]){ 묶음[t.s]=[]; 과목순.push(t.s); }
    묶음[t.s].push(t);
  });
  var 순={S:0,A:1,B:2,C:3};
  var box=document.getElementById('list');
  과목순.forEach(function(과){
    var 것들=묶음[과].slice().sort(function(a,b){ return (순[a.g]-순[b.g])||(b.f-a.f); });
    var n=것들.reduce(function(a,t){return a+t.c;},0);
    var m=것들.reduce(function(a,t){return a+Math.min(맞힘[t.k]||0,t.c);},0);
    var h='<div class="subj"><div class="subjhd"><h2>'+esc(과)+'</h2>'+
      '<span>'+m+' / '+n+'문항 · '+Math.round(m*100/(n||1))+'%</span></div>';
    var 현재='';
    것들.forEach(function(t){
      if(t.g!==현재){
        현재=t.g;
        var 말={S:'먼저 이것부터',A:'그다음',B:'여유 있으면',C:'나오면 줍는 자리'}[t.g];
        h+='<div class="grp">'+t.g+'급 · '+말+'</div>';
      }
      var 친것=Math.min(맞힘[t.k]||0,t.c), 비=Math.round(친것*100/(t.c||1));
      var 갈곳=강의[t.k]? 'lecture.html?code='+encodeURIComponent(t.k)
                        : 'study.html?code='+encodeURIComponent(t.k);
      h+='<a class="card'+(비>=60?' done':'')+'" href="'+갈곳+'">'+
        '<span class="fill" style="width:'+비+'%"></span>'+
        '<span class="bd '+t.g+'">'+t.g+'</span>'+
        '<span class="tx"><b>'+esc(t.n)+(강의[t.k]?'<i class="dot"></i>':'')+'</b>'+
        '<small>'+esc(t.m)+' · 회차당 '+t.f+'문항</small></span>'+
        '<span class="rt"><em>'+친것+'/'+t.c+'</em><s>'+비+'%</s></span></a>';
    });
    box.insertAdjacentHTML('beforeend', h+'</div>');
  });
})();
</script>
</body></html>
