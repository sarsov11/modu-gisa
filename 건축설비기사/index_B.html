<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모두의 건축설비 — 오늘 (B안)</title>
<link rel="stylesheet" href="css/base.css">
<meta name="theme-color" content="#08090B">
<style>
/* B안 — 홈이 '오늘 팔 갈래' 한 장이다. 매일 그림이 바뀌므로 홈이 매일 다르다. */
body{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 96px}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 14px}
.brand{font-size:17px;font-weight:800;color:var(--ink)}
.brand small{font-weight:600;color:var(--ink-4);font-size:11px;margin-left:7px}
.dd{font-size:13px;font-weight:800;color:var(--red-2);font-variant-numeric:tabular-nums}

.today{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line-2);
  background:var(--surface)}
.today .fig{width:100%;height:230px;object-fit:cover;object-position:50% 42%;display:block;background:#fff}
.today .veil{position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(180deg,rgba(8,9,11,0),rgba(8,9,11,.92) 72%)}
.today .tx{position:absolute;left:16px;right:16px;bottom:14px}
.chip{display:inline-block;font-size:10px;letter-spacing:.14em;font-weight:800;color:#fff;
  background:var(--red);border-radius:99px;padding:4px 9px}
.today h2{margin:9px 0 4px;font-size:21px;color:#fff;letter-spacing:-.02em;line-height:1.25}
.today p{margin:0;font-size:12px;color:rgba(255,255,255,.72);line-height:1.55}
.go{display:block;width:100%;margin-top:14px;padding:16px;border-radius:14px;border:0;cursor:pointer;
  background:var(--red);color:#fff;font-size:16px;font-weight:800}
.go.sub{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);
  margin-top:8px;font-size:14px;padding:13px}
.meter{display:flex;align-items:center;gap:12px;margin-top:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.meter img{width:44px;height:44px;border-radius:11px;object-fit:cover;border:1px solid var(--line-2)}
.meter .mi{flex:1;min-width:0}
.meter b{font-size:14px;color:var(--ink)}
.meter span{display:block;font-size:11px;color:var(--ink-4);margin-top:2px}
.mbar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:7px;border:1px solid var(--line)}
.mbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ffb020)}
.cnt{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:4px}
.stile{flex:0 0 128px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--bg-2);text-decoration:none;color:inherit}
.stile img{width:100%;height:64px;object-fit:cover;display:block;background:#fff}
.stile .st{padding:8px 9px 10px}
.stile b{display:block;font-size:11px;color:var(--ink);line-height:1.35}
.stile em{display:block;font-style:normal;font-size:10px;color:var(--ink-4);margin-top:3px}
.sechd{font-size:11px;letter-spacing:.14em;color:var(--ink-4);font-weight:700;margin:20px 0 0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line)}
.tabs a{padding:12px 0;text-align:center;font-size:12px;color:var(--ink-4);text-decoration:none;font-weight:700}
.tabs a.on{color:var(--red-2)}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="brand">모두의 건축설비<small>건축설비기사 필기</small></div>
    <div class="dd" id="dday"></div>
  </div>

  <div class="today">
    <img class="fig" id="fig" alt="">
    <div class="veil"></div>
    <div class="tx">
      <span class="chip" id="chip">오늘</span>
      <h2 id="gal"></h2>
      <p id="det"></p>
    </div>
  </div>

  <button class="go" id="start">오늘 <span id="n"></span>문제 풀기</button>
  <button class="go sub" id="killer">틀린 것만 다시</button>

  <div class="meter">
    <img id="badge" alt="">
    <div class="mi">
      <b id="tname"></b>
      <span id="tnext"></span>
      <div class="mbar"><i id="tbar" style="width:0%"></i></div>
    </div>
    <div class="cnt" id="done"></div>
  </div>

  <div class="sechd">약한 갈래</div>
  <div class="strip" id="weak"></div>
</div>

<nav class="tabs">
  <a href="index.html">오늘</a><a href="study.html">문제</a>
  <a href="skilltree.html">진행</a><a href="settings.html">설정</a>
</nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  var r=T.루틴(), dd=T.디데이(), ti=T.티어(), g=T.오늘갈래();
  document.getElementById('dday').textContent = dd>0? ('D-'+dd) : (dd===0?'D-DAY':'');
  if(g){
    document.getElementById('gal').textContent=g.갈래;
    document.getElementById('det').textContent=
      (g.과목? g.과목+' · ':'')+(g.세부||[]).slice(0,3).join(' · ');
    var f=document.getElementById('fig');
    if(g.그림) f.src='img/'+g.그림; else f.remove();
  } else { document.getElementById('gal').textContent='오늘 몫'; }
  document.getElementById('chip').textContent = r.끝? '오늘 끝' : '오늘 여기';
  document.getElementById('n').textContent = r.남은? (r.남은+' ') : '';
  document.getElementById('start').onclick=function(){location.href='study.html?mode=today';};
  document.getElementById('killer').onclick=function(){location.href='study.html?mode=wrong';};
  document.getElementById('badge').src='img/'+ti.배지;
  document.getElementById('tname').textContent=ti.이름;
  document.getElementById('tnext').textContent= ti.다음이름? (ti.다음이름+'까지 '+ti.남은점수+'점'):'최고 티어';
  document.getElementById('tbar').style.width=ti.진행+'%';
  document.getElementById('done').textContent=r.푼수+'/'+r.목표;

  /* 약한 갈래 — 정답률 낮은 순. 그림이 있는 갈래만 띄운다(카드가 비면 초라해진다) */
  var 갈래={};
  (G.문항||[]).forEach(function(q){
    if(!q.k) return; var k=q.k.split('.').slice(0,2).join('.');
    var v=갈래[k]=갈래[k]||{n:0,푼:0,맞:0};
    v.n++; var rec=T.S.푼것[q.i]; if(rec){v.푼++; if(rec.o) v.맞++;}
  });
  var 이름={};
  (G.트리||[]).forEach(function(n){ 이름[n.k.split('.').slice(0,2).join('.')]=n.m; });
  var 목록=Object.keys(갈래).filter(function(k){return (G.삽화||{})[k];})
    .map(function(k){var v=갈래[k];return {k:k,율:v.푼?v.맞/v.푼:0,푼:v.푼,n:v.n};})
    .sort(function(a,b){ return (a.푼?a.율:-1)-(b.푼?b.율:-1); }).slice(0,6);
  var box=document.getElementById('weak');
  목록.forEach(function(x){
    var a=document.createElement('a'); a.className='stile';
    a.href='study.html?code='+encodeURIComponent(x.k);
    a.innerHTML='<img src="img/'+(G.삽화||{})[x.k]+'" alt="" loading="lazy">'+
      '<div class="st"><b>'+(이름[x.k]||x.k)+'</b><em>'+
      (x.푼? Math.round(x.율*100)+'% · ':'')+x.n+'문항</em></div>';
    box.appendChild(a);
  });
})();
</script>
</body></html>
