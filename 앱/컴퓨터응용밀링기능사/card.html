<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개념 — 모두의 컴퓨터응용밀링기능사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<script>try{var _s=localStorage.getItem("modugisa2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  .hd{padding:24px 2px 0}
  .hd small{display:block;font-size:14.5px;color:var(--ink-3);font-weight:700}
  .hd h1{font-size:25px;letter-spacing:-.03em;margin:6px 0 0;font-weight:900}
  .prog{display:flex;gap:5px;margin:18px 0 16px}
  .prog i{flex:1;height:4px;border-radius:99px;background:var(--surface-3)}
  .prog i.on{background:var(--ink-3)}
  .kc{border:1px solid var(--line-2);border-radius:var(--r3);background:var(--surface);overflow:hidden}
  .kc img{display:block;width:100%;height:auto;background:#fff;border-bottom:1px solid var(--line)}
  .kc .in{padding:20px 20px 22px}
  .kc h2{font-size:20px;line-height:1.45;letter-spacing:-.02em;margin:0 0 12px}
  .kc ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .kc li{font-size:16px;line-height:1.7;color:var(--ink-2);padding-left:14px;position:relative}
  .kc li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .memo{margin-top:16px;padding:13px 15px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--bg-2)}
  .memo b{display:block;font-size:13.5px;color:var(--accent);font-weight:800;margin-bottom:6px}
  .memo span{display:block;font-size:15.5px;font-weight:700;line-height:1.65}
  .nav2{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
</style>
</head><body>
<div class="page">
  <div class="hd"><small id="eb"></small><h1 id="ttl">개념</h1></div>
  <div class="prog" id="prog"></div>
  <div id="stage"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/gstore.js"></script>
<script>
(function(){
  GS.내비("card.html");
  var D=GS.D, e=GS.esc, k=new URLSearchParams(location.search).get("k");
  /* k 없이 열면 고르라 하지 않고 오늘 할 테마의 개념을 편다 */
  if(!k || !(D.cards||{})[k]){
    var 할=GS.오늘할것();
    k = (할 && (D.cards||{})[할.k]) ? 할.k :
        (D.테마.find(function(t){return (D.cards||{})[t.k];})||{}).k;
  }
  var 장들=(D.cards||{})[k]||[], t=GS.테마맵[k]||{};
  function el(x){return document.getElementById(x);}
  if(!장들.length){ el("stage").innerHTML='<div class="none">이 테마는 개념이 아직 없어요.</div>'; return; }
  el("eb").textContent=(t.s||"")+" · "+(t.g||"")+"급";
  el("ttl").textContent=t.n||"";
  var i=0;
  function 그리기(){
    el("prog").innerHTML=장들.map(function(_,j){return '<i class="'+(j<=i?"on":"")+'"></i>';}).join("");
    var c=장들[i];
    el("stage").innerHTML=
      '<div class="kc">'+(c.f?'<img src="img/'+e(c.f)+'" alt="">':'')+
        '<div class="in"><h2>'+e(c.t)+'</h2><ul>'+
          (c.l||[]).map(function(x){return '<li>'+e(x)+'</li>';}).join("")+'</ul>'+
          ((c.m||[]).length?'<div class="memo"><b>외울 것</b>'+
            c.m.map(function(x){return '<span>'+e(x)+'</span>';}).join("")+'</div>':'')+
        '</div></div>'+
      '<div class="nav2">'+(i>0?'<button class="b" id="pv">앞</button>':'<span></span>')+
        (i+1<장들.length?'<button class="b main" id="nx">다음</button>'
          :'<a class="b main" href="ox.html?k='+encodeURIComponent(k)+'">O·X 로 확인</a>')+'</div>';
    if(el("pv")) el("pv").onclick=function(){i--;그리기();};
    if(el("nx")) el("nx").onclick=function(){i++;그리기();};
    if(i+1>=장들.length) GS.카드봄(k);
    window.scrollTo({top:0,behavior:"smooth"});
  }
  그리기();
})();
</script>
</body></html>
