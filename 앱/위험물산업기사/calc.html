<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>계산기 — 모두의 위산기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<link rel="stylesheet" href="css/q.css">
<script>try{var _s=localStorage.getItem("modugisa2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}
try{var _u=new URLSearchParams(location.search).get("ui")||localStorage.getItem("gisa.calc.ui")||"A";document.documentElement.dataset.ui=_u;}catch(e){document.documentElement.dataset.ui="A";}</script>
<style>
/* 소방 실기 계산기 — 유형별 단계 풀이 + 공학용 계산기. 색은 base.css 변수만 쓴다 */
.page{padding-bottom:120px}
.ct-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r3);padding:5px;margin:14px 0 18px}
.ct-seg a{text-align:center;padding:11px 4px;border-radius:calc(var(--r3) - 5px);font-weight:800;font-size:15px;color:var(--ink-3);text-decoration:none}
.ct-seg a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line-2)}
.ct-types{display:grid;gap:8px}
.ct-type{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);padding:13px 15px}
.ct-type h3{margin:0 0 8px;font-size:15.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ct-type h3 b{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-weight:800}
.ct-type h3 small{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:700}
.ct-type .ls{display:flex;flex-wrap:wrap;gap:6px}
.ct-type .ls a{font-size:14px;font-weight:700;padding:7px 11px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink);text-decoration:none;background:var(--surface-2)}
.ct-q{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);padding:12px 14px;margin:0 0 12px}
.ct-q summary{cursor:pointer;font-weight:800;font-size:14.5px;color:var(--ink-2);list-style:none}
.ct-q p{margin:10px 0 0;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}
.ct-q img{display:block;max-width:100%;margin:10px auto 0;border-radius:var(--r1);background:#fff}
.ct-other{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ct-other a{font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-3);text-decoration:none}
.ct-other a.on{border-color:var(--ink);color:var(--ink)}
.ct-in{border:1.5px solid var(--line-2);border-radius:var(--r2);background:var(--surface);padding:6px 14px 12px;margin:0 0 12px}
.ct-in h3{margin:10px 0 4px;font-size:14px;color:var(--ink-3);font-weight:800}
.ct-f{display:grid;grid-template-columns:1fr minmax(0,168px);gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.ct-f:last-child{border-bottom:0}
.ct-f label{font-size:14.5px;line-height:1.35;word-break:keep-all}
.ct-f label b{font-family:var(--mono);font-weight:800;font-size:12.5px;padding:1px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);margin-right:6px;color:var(--ink-2)}
.ct-f label i{font-style:normal;font-size:12.5px;color:var(--ink-3)}
.ct-f .w{display:flex;gap:4px;min-width:0}
.ct-f input,.ct-f select,.ct-s input,.ct-s select,.ct-cv input,.ct-cv select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:10px;padding:9px 8px;min-width:0;box-sizing:border-box}
.ct-f input{flex:1;width:100%;text-align:right;font-family:var(--mono);font-weight:700}
.ct-f select.u{flex:0 0 auto;max-width:86px;font-size:13.5px;padding:9px 4px}
.ct-f select.g{width:100%;font-size:14px}
.ct-f .w:has(select.g){flex-direction:column}
.ct-f input.x{text-align:right}
.ct-f.miss input{border-color:var(--accent)}
.ct-f .ut{flex:0 0 auto;align-self:center;font-size:13.5px;color:var(--ink-3);min-width:36px}
.ct-mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.ct-mode button{appearance:none;font:inherit;font-weight:800;font-size:15px;padding:12px 6px;border-radius:var(--r2);border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--ink-3);cursor:pointer}
.ct-mode button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.ct-left{font-size:13.5px;color:var(--ink-3);margin:6px 2px 12px;line-height:1.6}
.ct-steps{display:grid;gap:10px;margin:14px 0}
.ct-s{border:1.5px solid var(--line-2);border-radius:var(--r2);background:var(--surface);padding:13px 15px}
.ct-s h4{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.ct-s h4 em{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;font-weight:900;flex:0 0 auto}
.ct-s h4 .ans{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 7px}
.ct-s .fx{margin:9px 0 0;font-family:var(--mono);font-size:15px;line-height:1.75;word-break:break-all}
.ct-s .fx div{padding-left:1.1em;text-indent:-1.1em}
.ct-s .fx .r{font-weight:900;font-size:17px}
.ct-s .fx .r span{font-weight:700;font-size:14px;color:var(--ink-3);margin-left:4px}
.ct-s .mm{margin-top:8px;font-size:13.5px;line-height:1.6;color:var(--ink-3);word-break:keep-all}
.ct-s .try{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ct-s .try input{flex:1 1 120px;text-align:right;font-family:var(--mono);font-weight:700}
.ct-s .try select{flex:0 0 auto;font-size:14px}
.ct-s .try button,.ct-s .tf button{appearance:none;font:inherit;font-weight:800;font-size:14.5px;border-radius:10px;padding:9px 14px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg)}
.ct-s .try button.q{background:transparent;color:var(--ink-3);border-color:var(--line-2)}
.ct-s .tf{display:flex;gap:6px;margin-top:10px}
.ct-s .tf button{flex:1;background:var(--surface-2);color:var(--ink)}
.ct-s .ct-vd{margin-top:10px;font-weight:800;font-size:14.5px}
.ct-s .ct-vd.정답{color:var(--ink)} .ct-s .ct-vd.정답::before{content:"● "}
.ct-s .ct-vd.오답,.ct-s .ct-vd.단위,.ct-s .ct-vd.근접{color:var(--accent)} .ct-s .ct-vd.오답::before{content:"✕ "} .ct-s .ct-vd.단위::before,.ct-s .ct-vd.근접::before{content:"△ "}
.ct-s.ok{border-color:var(--ink)} .ct-s.no{border-color:var(--accent)}
.ct-skip{font-size:13.5px;color:var(--ink-3);line-height:1.6;margin:4px 2px}
.ct-sum{border:1.5px solid var(--ink);border-radius:var(--r2);padding:14px 16px;margin:6px 0 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ct-sum b{font-family:var(--mono);font-size:22px}
.ct-src{font-size:12.5px;color:var(--ink-3);margin:16px 2px;line-height:1.6}

/* 공학용 계산기 */
.ct-kp{border:1.5px solid var(--line-2);border-radius:var(--r3);background:var(--surface);padding:12px;margin-bottom:14px}
.ct-disp{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r2);padding:10px 12px;margin-bottom:10px;min-height:76px;display:flex;flex-direction:column;justify-content:flex-end}
.ct-disp input{all:unset;font-family:var(--mono);font-size:18px;color:var(--ink-2);text-align:right;width:100%;word-break:break-all}
.ct-disp output{display:block;font-family:var(--mono);font-size:30px;font-weight:900;text-align:right;color:var(--ink);word-break:break-all}
.ct-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ct-keys button{appearance:none;font:inherit;font-family:var(--mono);font-weight:800;font-size:17px;padding:13px 0;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);cursor:pointer}
.ct-keys button.f{font-size:14.5px;color:var(--ink-2)}
.ct-keys button.op{background:var(--surface);}
.ct-keys button.eq{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ct-keys button.ac{color:var(--accent)}
.ct-hist{font-family:var(--mono);font-size:13.5px;color:var(--ink-3);margin-top:8px;max-height:96px;overflow:auto}
.ct-hist div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;cursor:pointer}
.ct-cv{border:1.5px solid var(--line-2);border-radius:var(--r3);background:var(--surface);padding:12px 14px}
.ct-cv h3{margin:0 0 10px;font-size:15px}
.ct-cv .row{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}
.ct-cv input{text-align:right;font-family:var(--mono);font-weight:700;width:100%}
.ct-cv .out{font-family:var(--mono);font-size:22px;font-weight:900;text-align:right;padding:6px 2px}
.ct-cv .qk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ct-cv .qk button{appearance:none;font:inherit;font-size:13px;font-weight:700;padding:6px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.ct-ui{display:flex;gap:6px;justify-content:flex-end;margin:6px 0 0;font-size:12.5px;color:var(--ink-3)}
.ct-ui a{color:var(--ink-3);padding:2px 8px;border:1px solid var(--line-2);border-radius:99px;text-decoration:none}
.ct-ui a.on{color:var(--ink);border-color:var(--ink)}

/* ── 안 B: 계산기 테이프 — 단계가 영수증처럼 한 줄씩 찍힌다 ── */
:root[data-ui="B"] .ct-steps{gap:0;border-radius:var(--r2);overflow:hidden;background:var(--ink);color:var(--bg);padding:6px 0}
:root[data-ui="B"] .ct-s{background:transparent;border:0;border-bottom:1px dashed color-mix(in srgb,var(--bg) 30%,transparent);border-radius:0;color:var(--bg);padding:12px 16px}
:root[data-ui="B"] .ct-s:last-child{border-bottom:0}
:root[data-ui="B"] .ct-s h4{color:var(--bg)}
:root[data-ui="B"] .ct-s h4 em{background:var(--bg);color:var(--ink)}
:root[data-ui="B"] .ct-s .fx{text-align:right}
:root[data-ui="B"] .ct-s .fx div{padding-left:0;text-indent:0}
:root[data-ui="B"] .ct-s .fx .r{font-size:21px}
:root[data-ui="B"] .ct-s .fx .r span,:root[data-ui="B"] .ct-s .mm{color:color-mix(in srgb,var(--bg) 65%,transparent)}
:root[data-ui="B"] .ct-s .try input,:root[data-ui="B"] .ct-s .try select{background:color-mix(in srgb,var(--bg) 12%,var(--ink));color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
:root[data-ui="B"] .ct-s .try button{background:var(--bg);color:var(--ink);border-color:var(--bg)}
:root[data-ui="B"] .ct-s .try button.q{background:transparent;color:var(--bg)}
:root[data-ui="B"] .ct-s .ct-vd.정답{color:var(--bg)}
:root[data-ui="B"] .ct-s .ct-vd.오답,:root[data-ui="B"] .ct-s .ct-vd.단위,:root[data-ui="B"] .ct-s .ct-vd.근접{color:var(--accent)}
:root[data-ui="B"] .ct-s .tf button{background:transparent;color:var(--bg);border-color:var(--bg)}
:root[data-ui="B"] .ct-s h4 .ans{color:var(--bg);border-color:var(--bg)}
:root[data-ui="B"] .ct-in{border-style:dashed}

/* ── 안 C: 넓은 화면 2단(왼쪽 문제·값, 오른쪽 풀이), 휴대폰에서는 값 칸을 접는다 ── */
@media (min-width:900px){
  :root[data-ui="C"] .page{max-width:1080px}
  :root[data-ui="C"] #solve{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
  :root[data-ui="C"] #solve .ct-steps{margin-top:0}
}
@media (max-width:899px){
  :root[data-ui="C"] .ct-in.fold2 .ct-f{display:none}
  :root[data-ui="C"] .ct-in.fold2 .sumline{display:block}
}
.ct-in .sumline{display:none;font-family:var(--mono);font-size:14px;line-height:1.7;padding:6px 0;color:var(--ink-2);cursor:pointer}
.ct-in .sumline u{text-decoration:none;color:var(--ink);font-weight:800;margin-left:6px}
</style>
</head><body>
<div class="page">
  <div class="hd"><h1 id="ttl">계산기</h1></div>
  <div class="ct-seg" id="seg"><a href="calc.html" data-tab="type">유형별 풀이</a><a href="calc.html?tab=kp" data-tab="kp">공학용 계산기</a></div>
  <div id="stage"></div>
  <div class="ct-ui" id="uisel"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/gsilgi.js"></script>
<script src="js/gcalc.js"></script>
<script src="js/judge.js"></script>
<script src="js/gstore.js"></script>
<script src="js/calc.js"></script>
<script>
(function(){
  GS.내비("silgi.html");
  var CF=window.CF||{계산기:[],유형:{}}, SG=window.SG||{문항:[]}, C=window.CALC, e=GS.esc, P=new URLSearchParams(location.search);
  function el(x){return document.getElementById(x);}
  var 계들=CF.계산기, 표={}; 계들.forEach(function(c){표[c.id]=c;});
  var 탭=P.get("tab")==="kp"?"kp":"type";
  document.querySelectorAll("#seg a").forEach(function(a){ if(a.dataset.tab===탭) a.classList.add("on"); });
  /* 안 고르기(대표님 시안 비교용) — ?ui=A|B|C, 고른 안은 이 기기에 남는다 */
  var ui=document.documentElement.dataset.ui;
  el("uisel").innerHTML='화면 안 '+["A","B","C"].map(function(u){
    var q=new URLSearchParams(location.search); q.set("ui",u);
    return '<a href="?'+q.toString()+'" data-u="'+u+'" class="'+(u===ui?"on":"")+'">'+u+'</a>';}).join("");
  el("uisel").addEventListener("click",function(ev){var a=ev.target.closest("a[data-u]"); if(a){try{localStorage.setItem("gisa.calc.ui",a.dataset.u);}catch(_){}}});

  if(탭==="kp") return 공학용();

  /* ── 문항에서 왔으면 그 문항과 주어진 값 ── */
  var 문항=null, qid=P.get("q");
  if(qid) 문항=SG.문항.filter(function(x){return x.id===qid;})[0]||null;
  var cid=P.get("c"), 연결=null;
  if(문항 && 문항.cx && P.get("s")!=null){ 연결=문항.cx[Number(P.get("s"))]||null; if(연결&&표[연결.c]&&!cid) cid=연결.c; }
  if(!cid && 문항 && 문항.c && 표[문항.c]) cid=문항.c;
  var 유형=P.get("t")||(문항&&(문항.tp||문항.t))||"";   /* 소방 유형코드는 tp(앱생성이 옮김) */
  if(!cid && 유형) cid=고른계산기(유형, 문항&&문항.v);
  if(!cid || !표[cid]) return 목록();
  return 풀이(표[cid]);

  function 고른계산기(t, v){
    var 후보=계들.filter(function(c){return c.t===t;});
    if(!후보.length) return null;
    if(!v) return 후보[0].id;
    var 키=값목록(v).map(function(o){return o.k||o.이름;});
    후보.sort(function(a,b){return 맞는수(b,키)-맞는수(a,키);});
    return 후보[0].id;
  }
  function 맞는수(c,키){return 키.filter(function(k){return !!입력찾기(c,k);}).length;}
  function 값목록(v){
    if(!v) return [];
    if(Array.isArray(v)) return v.map(function(o){return {k:o.k, 이름:o.이름, 값:o.값!=null?o.값:o.v, 단위:o.단위||o.u||""};});
    return Object.keys(v).map(function(k){var x=v[k];
      if(Array.isArray(x)) return {k:k,값:x[0],단위:x[1]||""};
      if(x&&typeof x==="object") return {k:k,값:x.값!=null?x.값:x.v,단위:x.단위||x.u||""};
      return {k:k,값:x,단위:""};});
  }
  function 입력찾기(c,k){
    if(!k) return null;
    return c.입력.filter(function(i){return i.k===k;})[0]||c.입력.filter(function(i){return i.이름===k;})[0]||
      c.입력.filter(function(i){return k.length>=2&&(i.이름.indexOf(k)>=0||k.indexOf(i.이름)>=0);})[0]||null;
  }

  /* ── 유형 목록 ── */
  function 목록(){
    el("ttl").textContent="계산기";
    var 쓰인={}; SG.문항.forEach(function(x){ var u=x.tp||x.t; if(u) 쓰인[u]=(쓰인[u]||0)+1; });
    var ts=[]; 계들.forEach(function(c){ if(ts.indexOf(c.t)<0) ts.push(c.t); });
    var 유=CF.유형||{};
    el("stage").innerHTML=(계들.length?'':'<div class="none">이 종목은 계산기를 준비하고 있습니다.</div>')+
      '<div class="ct-types">'+ts.map(function(t){
        var u=유[t]||{};
        var n=쓰인[t]||u.n||0;
        return '<div class="ct-type"><h3><b>'+e(t)+'</b>'+e(u.이름||t)+(n?'<small>기출 '+n+'문항</small>':'')+'</h3><div class="ls">'+
          계들.filter(function(c){return c.t===t;}).map(function(c){return '<a href="calc.html?c='+c.id+'">'+e(c.이름)+'</a>';}).join("")+'</div></div>';
      }).join("")+'</div>';
  }

  /* ── 풀이 화면 ── */
  function 풀이(계){
    el("ttl").textContent=계.이름;
    var 모드=P.get("m")==="see"?"see":"try";
    var 같은=계들.filter(function(c){return c.t===계.t;});
    var h='';
    if(문항){
      h+='<details class="ct-q" open><summary>문제 · '+e(문항.y+"년 "+문항.r+"회 "+문항.n+"번")+(연결&&연결.no?' · '+e(연결.no)+' 풀이':'')+'</summary><p>'+e(문항.q)+'</p>'+
        (문항.img||[]).map(function(f){return '<img loading="lazy" alt="" src="img/silgi/'+e(f)+'">';}).join("")+'</details>';
    }
    if(같은.length>1) h+='<div class="ct-other">'+같은.map(function(c){
      var q=new URLSearchParams(location.search); q.set("c",c.id); q.delete("t");
      return '<a class="'+(c.id===계.id?"on":"")+'" href="?'+q.toString()+'">'+e(c.이름)+'</a>';}).join("")+'</div>';
    h+='<div id="solve"><div class="colL"><div class="ct-in" id="ins"><h3>주어진 값</h3><div class="sumline" id="sumline"></div>'+계.입력.map(function(i){return 입력칸(i,계);}).join("")+'</div>'+
      '<div class="ct-mode" id="mode"><button data-m="try" aria-pressed="'+(모드==="try")+'">단계마다 내가 풀기</button><button data-m="see" aria-pressed="'+(모드==="see")+'">풀이 바로 보기</button></div>'+
