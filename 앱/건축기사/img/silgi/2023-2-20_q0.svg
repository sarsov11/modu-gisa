  <line class="th" x1="86" y1="44" x2="22" y2="44"/><line class="th" x1="86" y1="188" x2="22" y2="188"/>
  <line class="dm" x1="64" y1="44" x2="64" y2="188" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
