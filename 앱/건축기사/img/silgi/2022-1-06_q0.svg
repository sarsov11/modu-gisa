  <line class="ld" x1="440" y1="112" x2="252" y2="112" marker-end="url(#ar)"/>
  <circle class="nd" cx="456" cy="112" r="14"/><text class="tb" x="456" y="117" text-anchor="middle">1</text>
  <!-- ② 배면 흙 쪽 -->
  <line class="th" x1="84" y1="248" x2="112" y2="262" marker-end="url(#ai)"/>
  <circle class="nd" cx="62" cy="244" r="14"/><text class="tb" x="62" y="249" text-anchor="middle">2</text>
  <!-- ③ 근입부 -->
  <line class="th" x1="440" y1="280" x2="304" y2="302" marker-end="url(#ai)"/>
  <circle class="nd" cx="456" cy="278" r="14"/><text class="tb" x="456" y="283" text-anchor="middle">3</text>
  <text class="ts" x="16" y="362">화살표 = 흙막이벽에 작용하는 힘의 방향</text>
</svg>