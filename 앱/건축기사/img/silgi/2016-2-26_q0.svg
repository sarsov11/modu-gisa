<svg viewBox="0 0 620 350" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 입면: 하중으로 1 m -> 990 mm -->
  <text class="ts" x="140" y="338">[입면]</text>
  <rect class="fl" x="116" y="300" width="128" height="12"/><rect x="116" y="300" width="128" height="12" fill="url(#hat)"/>
  <line class="m" x1="108" y1="300" x2="252" y2="300"/>
  <rect class="sup" x="140" y="92" width="80" height="208"/>
  <rect class="sup" x="134" y="84" width="92" height="8"/>
  <line class="dsh" x1="116" y1="70" x2="252" y2="70"/>
  <line class="ld" x1="180" y1="14" x2="180" y2="82" marker-end="url(#ar)"/><text class="tr" x="192" y="30"><tspan class="tm">P</tspan> = 1,000 kN</text>
  <!-- Delta L -->
  <line class="dm" x1="124" y1="70" x2="124" y2="84" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tm" x="92" y="82">ΔL</text>
  <!-- 990 mm -->
  <line class="th" x1="100" y1="92" x2="134" y2="92"/>
  <line class="dm" x1="108" y1="92" x2="108" y2="300" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="14" y="200">990 mm</text>
  <!-- L = 1 m -->
  <line class="th" x1="226" y1="70" x2="276" y2="70"/><line class="th" x1="252" y1="300" x2="276" y2="300"/>
  <line class="dm" x1="270" y1="70" x2="270" y2="300" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="282" y="190"><tspan class="tm">L</tspan> = 1 m</text>
  <!-- 단면 -->
  <rect class="sup" x="400" y="130" width="100" height="100"/>
  <line class="th" x1="500" y1="130" x2="528" y2="130"/><line class="th" x1="500" y1="230" x2="528" y2="230"/>
  <line class="dm" x1="522" y1="130" x2="522" y2="230" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="532" y="186">400 mm</text>
  <line class="th" x1="400" y1="230" x2="400" y2="256"/><line class="th" x1="500" y1="230" x2="500" y2="256"/>
  <line class="dm" x1="400" y1="250" x2="500" y2="250" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="450" y="274" text-anchor="middle">400 mm</text>
  <text class="ts" x="426" y="338">[단면]</text>
</svg>