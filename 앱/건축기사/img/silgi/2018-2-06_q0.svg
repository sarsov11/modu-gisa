<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 인장 판재: 세로 70+80+80+70 = 300 mm, 1 px = 1 mm -->
  <rect class="fl" x="100" y="40" width="300" height="300"/>
  <rect class="ln" x="100" y="40" width="300" height="300"/>
  <!-- 파단선 -->
  <line class="dsh" x1="170" y1="30" x2="170" y2="350"/>
  <polyline class="dsh" points="170,110 220,190 170,270"/>
  <text class="tb" x="164" y="22">A</text><text class="tb" x="164" y="370">B</text>
  <!-- 구멍 -->
  <circle class="nd" cx="170" cy="110" r="11"/>
  <circle class="nd" cx="220" cy="190" r="11"/>
  <circle class="nd" cx="170" cy="270" r="11"/>
  <circle class="nd" cx="270" cy="110" r="11"/>
  <circle class="nd" cx="270" cy="270" r="11"/>
  <text class="tx" x="146" y="106">1</text><text class="tx" x="234" y="186">2</text><text class="tx" x="146" y="286">3</text>
  <!-- 인장력 -->
  <line class="ld" x1="400" y1="190" x2="470" y2="190" marker-end="url(#ar)"/>
  <text class="tr" x="478" y="195">P</text>
  <!-- 세로 치수 -->
  <line class="th" x1="100" y1="40" x2="52" y2="40"/><line class="th" x1="100" y1="110" x2="52" y2="110"/><line class="th" x1="100" y1="190" x2="52" y2="190"/><line class="th" x1="100" y1="270" x2="52" y2="270"/><line class="th" x1="100" y1="340" x2="52" y2="340"/>
  <line class="dm" x1="60" y1="40" x2="60" y2="110" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="60" y1="110" x2="60" y2="190" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="60" y1="190" x2="60" y2="270" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="60" y1="270" x2="60" y2="340" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="22" y="80">70</text><text class="tx" x="22" y="155">80</text><text class="tx" x="22" y="235">80</text><text class="tx" x="22" y="310">70</text>
  <!-- 가로 치수 -->
  <line class="th" x1="170" y1="360" x2="170" y2="392"/><line class="th" x1="220" y1="360" x2="220" y2="392"/><line class="th" x1="270" y1="360" x2="270" y2="392"/>
  <line class="dm" x1="170" y1="386" x2="220" y2="386" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="220" y1="386" x2="270" y2="386" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="185" y="406">50</text><text class="tx" x="235" y="406">50</text>
  <text class="ts" x="300" y="392">단위 mm · 판 두께 10 mm · 구멍 22 mm</text>
</svg>