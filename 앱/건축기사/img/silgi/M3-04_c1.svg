  <line class="ln" x1="340" y1="160" x2="314" y2="160" marker-end="url(#ai)"/><line class="ln" x1="340" y1="160" x2="366" y2="160" marker-end="url(#ai)"/>
  <line class="ln" x1="140" y1="200" x2="140" y2="112" marker-end="url(#ai)"/><line class="ln" x1="220" y1="200" x2="220" y2="112" marker-end="url(#ai)"/>
