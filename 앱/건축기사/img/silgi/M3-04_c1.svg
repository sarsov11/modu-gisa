  <rect class="hl" x="290" y="90" width="20" height="140"/><rect class="ln" x="290" y="90" width="20" height="140" fill="none"/>
  <rect class="hl" x="370" y="90" width="20" height="140"/><rect class="ln" x="370" y="90" width="20" height="140" fill="none"/>
