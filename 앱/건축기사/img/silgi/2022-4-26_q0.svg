  <circle class="rb" cx="122" cy="52" r="7"/><circle class="rb" cx="198" cy="52" r="7"/>
  <circle class="rb" cx="122" cy="228" r="7"/><circle class="rb" cx="160" cy="228" r="7"/><circle class="rb" cx="198" cy="228" r="7"/>
  <text class="tb" x="240" y="124">D10@150</text>
  <line class="th" x1="236" y1="118" x2="210" y2="118"/>
  <text class="ts" x="240" y="146">a<tspan dy="4" class="ts">1</tspan><tspan dy="-4" class="ts"> = 71.33 mm²</tspan></text>
