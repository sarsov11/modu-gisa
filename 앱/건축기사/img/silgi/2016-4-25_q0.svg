<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 평면: 위 60,000 x 50,000 / 아래 40,000 x 30,000 -->
  <text class="ts" x="100" y="30">평면 (위에서 본 터파기)</text>
  <rect class="sup" x="100" y="50" width="360" height="300"/>
  <rect class="fl" x="160" y="110" width="240" height="180"/>
  <rect class="ln" x="160" y="110" width="240" height="180"/>
  <line class="ln" x1="100" y1="50" x2="160" y2="110"/><line class="ln" x1="460" y1="50" x2="400" y2="110"/>
  <line class="ln" x1="100" y1="350" x2="160" y2="290"/><line class="ln" x1="460" y1="350" x2="400" y2="290"/>
  <!-- 세로 치수 -->
  <line class="th" x1="100" y1="50" x2="84" y2="50"/><line class="th" x1="160" y1="110" x2="84" y2="110"/><line class="th" x1="160" y1="290" x2="84" y2="290"/><line class="th" x1="100" y1="350" x2="84" y2="350"/>
  <line class="dm" x1="90" y1="50" x2="90" y2="110" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="90" y1="110" x2="90" y2="290" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="90" y1="290" x2="90" y2="350" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="82" y="86" text-anchor="end">10,000</text><text class="tx" x="82" y="204" text-anchor="end">30,000</text><text class="tx" x="82" y="326" text-anchor="end">10,000</text>
  <!-- 가로 치수 -->
  <line class="th" x1="100" y1="350" x2="100" y2="404"/><line class="th" x1="160" y1="290" x2="160" y2="380"/><line class="th" x1="400" y1="290" x2="400" y2="380"/><line class="th" x1="460" y1="350" x2="460" y2="404"/>
  <line class="dm" x1="100" y1="374" x2="160" y2="374" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="160" y1="374" x2="400" y2="374" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="400" y1="374" x2="460" y2="374" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="130" y="368" text-anchor="middle">10,000</text><text class="tx" x="280" y="368" text-anchor="middle">40,000</text><text class="tx" x="430" y="368" text-anchor="middle">10,000</text>
  <line class="dm" x1="100" y1="398" x2="460" y2="398" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="280" y="416" text-anchor="middle">60,000</text>
  <!-- 단면 -->
  <text class="ts" x="520" y="30">단면</text>
  <polyline class="m" points="500,110 545,110 575,200 625,200 655,110 700,110"/>
  <line class="dsh" x1="545" y1="110" x2="655" y2="110"/>
  <line class="dm" x1="600" y1="110" x2="600" y2="200" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="600" y="228" text-anchor="middle"><tspan class="tm">h</tspan> = 10,000</text>
  <text class="ts" x="500" y="268">단위 mm · 비탈면 위 60,000×50,000</text>
  <text class="ts" x="500" y="288">바닥 40,000×30,000 · 깊이 10,000</text>
</svg>