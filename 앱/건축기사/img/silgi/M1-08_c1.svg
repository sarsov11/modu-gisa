  <text class="tr" x="236" y="220" text-anchor="middle"><tspan class="tm">k</tspan> = <tspan class="tm">P</tspan> / <tspan class="tm">δ</tspan> = <tspan class="tm">EA</tspan> / <tspan class="tm">L</tspan></text>
