<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 겔버보 (1 m = 32 px) -->
  <line class="m" x1="50" y1="100" x2="530" y2="100"/>
  <!-- A 힌지 -->
  <polygon class="sup" points="50,102 34,128 66,128"/><line class="ln" x1="24" y1="128" x2="76" y2="128"/>
  <!-- B 롤러 -->
  <polygon class="sup" points="242,102 226,126 258,126"/><circle class="nd" cx="234" cy="131" r="4"/><circle class="nd" cx="250" cy="131" r="4"/><line class="ln" x1="216" y1="136" x2="268" y2="136"/>
  <!-- C 롤러 -->
  <polygon class="sup" points="530,102 514,126 546,126"/><circle class="nd" cx="522" cy="131" r="4"/><circle class="nd" cx="538" cy="131" r="4"/><line class="ln" x1="504" y1="136" x2="556" y2="136"/>
  <!-- 게르버 힌지 -->
  <circle class="nd" cx="338" cy="100" r="5"/>
  <text class="tb" x="26" y="90">A</text><text class="tb" x="250" y="90">B</text><text class="tb" x="540" y="90">C</text>
  <!-- 집중하중 40 kN -->
  <line class="ld" x1="146" y1="40" x2="146" y2="98" marker-end="url(#ar)"/>
  <text class="tr" x="116" y="32">40 kN</text>
  <!-- 등분포하중 30 kN/m -->
  <rect class="hl" x="338" y="60" width="192" height="40"/>
  <line class="ld" x1="338" y1="60" x2="530" y2="60"/>
  <line class="ld" x1="338" y1="60" x2="338" y2="97" marker-end="url(#ar)"/>
  <line class="ld" x1="386" y1="60" x2="386" y2="97" marker-end="url(#ar)"/>
  <line class="ld" x1="434" y1="60" x2="434" y2="97" marker-end="url(#ar)"/>
  <line class="ld" x1="482" y1="60" x2="482" y2="97" marker-end="url(#ar)"/>
  <line class="ld" x1="530" y1="60" x2="530" y2="97" marker-end="url(#ar)"/>
  <text class="tr" x="388" y="48">30 kN/m</text>
  <!-- 치수 -->
  <line class="th" x1="50" y1="140" x2="50" y2="186"/><line class="th" x1="146" y1="108" x2="146" y2="186"/><line class="th" x1="242" y1="140" x2="242" y2="186"/><line class="th" x1="338" y1="108" x2="338" y2="186"/><line class="th" x1="530" y1="140" x2="530" y2="186"/>
  <line class="dm" x1="50" y1="178" x2="146" y2="178" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="146" y1="178" x2="242" y2="178" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="242" y1="178" x2="338" y2="178" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="338" y1="178" x2="530" y2="178" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="86" y="204">3 m</text><text class="tx" x="182" y="204">3 m</text><text class="tx" x="278" y="204">3 m</text><text class="tx" x="418" y="204">6 m</text>
  <text class="ts" x="320" y="236">게르버 힌지</text>
</svg>