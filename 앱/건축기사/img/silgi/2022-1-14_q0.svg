<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 기둥(H형강, 정면): 양쪽 플랜지 + 웨브 -->
  <rect class="fl" x="116" y="30" width="68" height="380"/>
  <rect class="sup" x="100" y="30" width="16" height="380"/>
  <rect class="sup" x="184" y="30" width="16" height="380"/>
  <!-- 스티프너(기둥 플랜지 사이, 보 플랜지 높이) -->
  <rect class="sup" x="116" y="118" width="68" height="10"/>
  <rect class="sup" x="116" y="302" width="68" height="10"/>
  <!-- 보 웨브·플랜지 -->
  <rect class="fl" x="200" y="130" width="360" height="168"/>
  <rect class="sup" x="200" y="108" width="360" height="22"/>
  <rect class="sup" x="200" y="298" width="360" height="22"/>
  <!-- 상·하부 플랜지 플레이트 + 볼트 -->
  <rect class="sup" x="200" y="96" width="130" height="12"/>
  <rect class="sup" x="200" y="320" width="130" height="12"/>
  <g>
    <rect class="rb" x="238" y="96" width="10" height="34"/><rect class="rb" x="272" y="96" width="10" height="34"/><rect class="rb" x="306" y="96" width="10" height="34"/>
    <rect class="rb" x="238" y="298" width="10" height="34"/><rect class="rb" x="272" y="298" width="10" height="34"/><rect class="rb" x="306" y="298" width="10" height="34"/>
  </g>
  <!-- 웨브 전단 플레이트 + 볼트 4개 -->
  <rect class="sup" x="200" y="150" width="100" height="128"/>
  <circle class="rb" cx="262" cy="172" r="7"/><circle class="rb" cx="262" cy="196" r="7"/><circle class="rb" cx="262" cy="220" r="7"/><circle class="rb" cx="262" cy="244" r="7"/>
  <!-- 모살용접 기호 (위·아래 접합부) -->
  <line class="th" x1="200" y1="100" x2="240" y2="56" marker-start="url(#ai)"/>
  <polyline class="th" points="240,56 340,56"/>
  <polygon class="th" points="276,56 292,56 276,42"/>
  <line class="th" x1="200" y1="328" x2="240" y2="372" marker-start="url(#ai)"/>
  <polyline class="th" points="240,372 340,372"/>
  <polygon class="th" points="276,372 292,372 276,386"/>
  <!-- 이름표 -->
  <text class="tx" x="346" y="88">상부 플랜지 플레이트</text>
  <line class="th" x1="150" y1="130" x2="150" y2="300" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <circle class="nd" cx="150" cy="215" r="13"/><text class="tb" x="150" y="220" text-anchor="middle">1</text>
  <line class="th" x1="400" y1="388" x2="322" y2="334" marker-end="url(#ai)"/>
  <circle class="nd" cx="412" cy="394" r="13"/><text class="tb" x="412" y="399" text-anchor="middle">2</text>
  <line class="th" x1="372" y1="214" x2="304" y2="214" marker-end="url(#ai)"/>
  <circle class="nd" cx="386" cy="214" r="13"/><text class="tb" x="386" y="219" text-anchor="middle">3</text>
  <text class="ts" x="150" y="424" text-anchor="middle">기둥</text>
  <text class="ts" x="480" y="222" text-anchor="middle">보 웨브</text>
  <text class="ts" x="16" y="446">삼각 기호 = 모살용접 기호</text>
</svg>