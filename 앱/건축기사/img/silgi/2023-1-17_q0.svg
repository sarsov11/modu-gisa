  <line class="m" x1="280" y1="50" x2="280" y2="250"/>
  <line class="m" x1="80" y1="50" x2="180" y2="150"/>
  <line class="m" x1="280" y1="50" x2="180" y2="150"/>
  <line class="m" x1="80" y1="250" x2="180" y2="150"/>
  <line class="m" x1="280" y1="250" x2="180" y2="150"/>
  <circle class="nd" cx="80" cy="50" r="9"/><circle class="nd" cx="280" cy="50" r="9"/>
  <circle class="nd" cx="80" cy="250" r="9"/><circle class="nd" cx="280" cy="250" r="9"/>
  <circle class="nd" cx="180" cy="150" r="9"/>
