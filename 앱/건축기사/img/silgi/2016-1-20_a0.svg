<svg viewBox="0 0 540 460" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 구조: A 고정, C 중간힌지, B 롤러. R_A = P, M_A = P L1, R_B = 0 -->
  <rect class="sup" x="44" y="80" width="12" height="60"/><rect x="32" y="80" width="12" height="60" fill="url(#hat)"/>
  <line class="m" x1="56" y1="110" x2="207" y2="110"/><line class="m" x1="221" y1="110" x2="370" y2="110"/>
  <circle class="nd" cx="214" cy="110" r="7"/>
  <polygon class="sup" points="370,110 358,132 382,132"/>
  <circle class="nd" cx="361" cy="138" r="4"/><circle class="nd" cx="370" cy="138" r="4"/><circle class="nd" cx="379" cy="138" r="4"/>
  <line class="th" x1="350" y1="144" x2="390" y2="144"/>
  <line class="ld" x1="214" y1="48" x2="214" y2="101" marker-end="url(#ar)"/><text class="tr" x="204" y="40"><tspan class="tm">P</tspan></text>
  <text class="tb" x="14" y="118">A</text><text class="tb" x="206" y="134">C</text><text class="tb" x="396" y="118">B</text>
  <line class="ld" x1="140" y1="176" x2="140" y2="116" marker-end="url(#ar)"/>
  <text class="tr" x="16" y="172"><tspan class="tm">R</tspan><tspan dy="4" class="ts">A</tspan><tspan dy="-4"> = </tspan><tspan class="tm">P</tspan></text>
  <path class="ld" d="M104,78 A30,30 0 1 0 104,138" marker-end="url(#ar)"/>
  <text class="tr" x="16" y="62"><tspan class="tm">M</tspan><tspan dy="4" class="ts">A</tspan><tspan dy="-4"> = </tspan><tspan class="tm">PL</tspan><tspan dy="4" class="ts">1</tspan></text>
  <text class="tx" x="280" y="176"><tspan class="tm">R</tspan><tspan dy="4" class="ts">B</tspan><tspan dy="-4"> = 0</tspan></text>
  <line class="th" x1="56" y1="150" x2="56" y2="196"/><line class="th" x1="214" y1="118" x2="214" y2="196"/><line class="th" x1="370" y1="150" x2="370" y2="196"/>
  <line class="dm" x1="56" y1="190" x2="214" y2="190" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="214" y1="190" x2="370" y2="190" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="128" y="212"><tspan class="tm">L</tspan><tspan dy="4" class="ts">1</tspan></text>
  <text class="tx" x="284" y="212"><tspan class="tm">L</tspan><tspan dy="4" class="ts">2</tspan></text>
  <!-- SFD -->
  <polygon class="hl" points="56,290 56,250 214,250 214,290"/>
  <path class="ln" d="M56,290 V250 H214 V290"/>
  <line class="m" x1="56" y1="290" x2="207" y2="290"/><line class="m" x1="221" y1="290" x2="370" y2="290"/><circle class="nd" cx="214" cy="290" r="7"/>
  <text class="tr" x="130" y="242"><tspan class="tm">P</tspan></text><text class="tb" x="130" y="276">+</text>
  <text class="tb" x="384" y="295">SFD</text>
  <!-- BMD -->
  <polygon class="hl" points="56,390 56,340 214,390"/>
  <path class="ln" d="M56,390 V340 L214,390"/>
  <line class="m" x1="56" y1="390" x2="207" y2="390"/><line class="m" x1="221" y1="390" x2="370" y2="390"/><circle class="nd" cx="214" cy="390" r="7"/>
  <text class="tr" x="62" y="332">−<tspan class="tm">PL</tspan><tspan dy="4" class="ts">1</tspan></text><text class="tb" x="84" y="378">−</text>
  <text class="tb" x="384" y="395">BMD</text>
  <text class="tx" x="16" y="440">최대전단력 = <tspan class="tm">P</tspan>,  최대휨모멘트 = <tspan class="tm">PL</tspan><tspan dy="4" class="ts">1</tspan></text>
</svg>