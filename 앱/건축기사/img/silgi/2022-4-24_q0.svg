  <line class="m" x1="60" y1="180" x2="380" y2="180"/>
  <line class="m" x1="140" y1="100" x2="140" y2="180"/>
  <line class="m" x1="220" y1="100" x2="220" y2="180"/>
  <line class="m" x1="380" y1="100" x2="380" y2="180"/>
  <line class="m" x1="60" y1="100" x2="140" y2="180"/>
  <line class="m" x1="140" y1="100" x2="220" y2="180"/>
  <line class="m" x1="220" y1="180" x2="300" y2="100"/>
  <line class="m" x1="300" y1="180" x2="380" y2="100"/>
  <circle class="nd" cx="60" cy="100" r="7"/><circle class="nd" cx="140" cy="100" r="7"/><circle class="nd" cx="220" cy="100" r="7"/><circle class="nd" cx="300" cy="100" r="7"/><circle class="nd" cx="380" cy="100" r="7"/>
  <circle class="nd" cx="60" cy="180" r="7"/><circle class="nd" cx="140" cy="180" r="7"/><circle class="nd" cx="220" cy="180" r="7"/><circle class="nd" cx="300" cy="180" r="7"/><circle class="nd" cx="380" cy="180" r="7"/>
  <!-- 지점 -->
  <polygon class="sup" points="60,187 46,210 74,210"/><line class="ln" x1="36" y1="210" x2="84" y2="210"/>
  <polygon class="sup" points="380,187 366,208 394,208"/><circle class="nd" cx="372" cy="213" r="4"/><circle class="nd" cx="388" cy="213" r="4"/><line class="ln" x1="356" y1="218" x2="404" y2="218"/>
  <!-- 하중 -->
  <line class="ld" x1="140" y1="40" x2="140" y2="92" marker-end="url(#ar)"/>
  <line class="ld" x1="220" y1="40" x2="220" y2="92" marker-end="url(#ar)"/>
  <line class="ld" x1="300" y1="40" x2="300" y2="92" marker-end="url(#ar)"/>
  <text class="tr" x="116" y="30">40 kN</text><text class="tr" x="196" y="30">40 kN</text><text class="tr" x="276" y="30">40 kN</text>
