  <text class="tb" x="40" y="92">C</text><text class="tb" x="120" y="124">E</text><text class="tb" x="228" y="204">F</text>
  <text class="tb" x="22" y="206">A</text><text class="tb" x="408" y="210">B</text>
  <text class="tm" x="172" y="90">U<tspan dy="4" class="ts">2</tspan></text>
  <text class="tm" x="164" y="204">L<tspan dy="4" class="ts">2</tspan></text>
  <!-- 치수 -->
  <line class="th" x1="60" y1="222" x2="60" y2="250"/><line class="th" x1="140" y1="188" x2="140" y2="250"/><line class="th" x1="220" y1="188" x2="220" y2="250"/><line class="th" x1="300" y1="188" x2="300" y2="250"/><line class="th" x1="380" y1="222" x2="380" y2="250"/>
  <line class="dm" x1="60" y1="244" x2="140" y2="244" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
