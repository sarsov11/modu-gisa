  <line class="dm" x1="220" y1="244" x2="300" y2="244" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="300" y1="244" x2="380" y2="244" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="ts" x="88" y="268">3 m</text><text class="ts" x="168" y="268">3 m</text><text class="ts" x="248" y="268">3 m</text><text class="ts" x="328" y="268">3 m</text>
  <line class="th" x1="388" y1="100" x2="436" y2="100"/><line class="th" x1="388" y1="180" x2="436" y2="180"/>
  <line class="dm" x1="428" y1="100" x2="428" y2="180" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
