<svg class="gk" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg"><style>svg.gk{background:#FFFFFF}svg.gk .m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}svg.gk .ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}svg.gk .th{stroke:#5B6475;stroke-width:1.1;fill:none}svg.gk .dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}svg.gk .ld{stroke:#E0313A;stroke-width:1.8;fill:none}svg.gk .dm{stroke:#8C95A8;stroke-width:1.1;fill:none}svg.gk .crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}svg.gk .nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}svg.gk .rb{fill:#1F2533;stroke:none}svg.gk .fl{fill:#EEF1F6;stroke:none}svg.gk .hl{fill:#FDE7E8;stroke:none}svg.gk .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}svg.gk .tx,svg.gk .tb,svg.gk .ts,svg.gk .tr,svg.gk .tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}svg.gk .tb{font-weight:800}svg.gk .ts{font-size:12.5px;fill:#5B6475}svg.gk .tr{fill:#E0313A;font-weight:800}svg.gk .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 단면 왼쪽 절반 (가로 80 px = 1 m) -->
  <text class="tb" x="16" y="20">단면 (왼쪽 절반)</text>
  <rect x="50" y="50" width="70" height="190" fill="url(#hat)"/>
  <line class="m" x1="50" y1="50" x2="120" y2="50"/>
  <text class="tx" x="52" y="42">G.L</text>
  <line class="m" x1="120" y1="50" x2="120" y2="240"/>
  <text class="ts" x="126" y="42">흙막이</text>
  <!-- 기초 (잡석 + 밑창) -->
  <rect class="fl" x="200" y="222" width="150" height="18"/><rect x="200" y="222" width="150" height="18" fill="url(#hat)"/>
  <rect class="ln" x="200" y="222" width="150" height="18" fill="none"/>
  <!-- 지하실 벽 -->
  <rect class="sup" x="216" y="50" width="16" height="172"/>
  <line class="dsh" x1="224" y1="30" x2="224" y2="250"/>
  <text class="ts" x="224" y="22" text-anchor="middle">벽 중심선</text>
  <text class="tb" x="296" y="140" text-anchor="middle">지하실</text>
  <polyline class="th" points="350,222 350,240" fill="none"/>
  <polyline class="th" points="350,60 342,100 358,150 350,200" fill="none"/>
  <!-- 가로 치수 -->
  <line class="th" x1="120" y1="244" x2="120" y2="300"/><line class="th" x1="200" y1="244" x2="200" y2="276"/><line class="th" x1="224" y1="244" x2="224" y2="300"/>
  <line class="dm" x1="120" y1="268" x2="200" y2="268" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="200" y1="268" x2="224" y2="268" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="ts" x="160" y="262" text-anchor="middle">1 m</text>
  <text class="ts" x="220" y="286" text-anchor="middle">0.3 m</text>
  <line class="dm" x1="120" y1="298" x2="224" y2="298" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tr" x="172" y="320" text-anchor="middle">1.3 m</text>
  <!-- 깊이 치수 -->
  <line class="th" x1="46" y1="222" x2="190" y2="222"/>
  <line class="dm" x1="70" y1="50" x2="70" y2="222" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="30" y="140" text-anchor="middle">6.2 m</text>
  <text class="ts" x="236" y="216">벽 두께 0.2 m</text>
  <!-- 오른쪽 설명 -->
  <text class="tb" x="440" y="60">치수 읽는 법</text>
  <text class="tx" x="440" y="92">15 m, 10 m : 벽 중심선 치수</text>
  <text class="tx" x="440" y="116">기초 : 중심선에서 0.3 m 내민다</text>
  <text class="tx" x="440" y="140">흙막이 : 기초 끝에서 1 m 띄운다</text>
  <text class="tb" x="440" y="184">터파기 치수</text>
  <text class="tx" x="440" y="214">가로 15 + 1.3×2 = 17.6 m</text>
  <text class="tx" x="440" y="238">세로 10 + 1.3×2 = 12.6 m</text>
  <text class="tx" x="440" y="262">깊이 6.2 + 0.3 = 6.5 m</text>
  <text class="ts" x="440" y="296">지하실 외형은 중심선에서 0.1 m씩 더 나간다 (15.2 × 10.2)</text>
</svg>