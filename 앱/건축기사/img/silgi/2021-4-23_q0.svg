<svg viewBox="0 0 580 470" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 슬래브 A -->
  <rect class="hl" x="270" y="100" width="130" height="296"/>
  <!-- 큰보 4곳 -->
  <rect class="sup" x="120" y="80" width="280" height="20"/>
  <rect class="sup" x="120" y="396" width="280" height="20"/>
  <rect class="sup" x="100" y="100" width="20" height="296"/>
  <rect class="sup" x="400" y="100" width="20" height="296"/>
  <!-- 작은보 -->
  <rect class="sup" x="250" y="100" width="20" height="296"/>
  <!-- 기둥 4개 -->
  <rect class="sup" x="100" y="80" width="20" height="20"/><rect x="100" y="80" width="20" height="20" fill="url(#hat)"/>
  <rect class="sup" x="400" y="80" width="20" height="20"/><rect x="400" y="80" width="20" height="20" fill="url(#hat)"/>
  <rect class="sup" x="100" y="396" width="20" height="20"/><rect x="100" y="396" width="20" height="20" fill="url(#hat)"/>
  <rect class="sup" x="400" y="396" width="20" height="20"/><rect x="400" y="396" width="20" height="20" fill="url(#hat)"/>
  <text class="tb" x="335" y="252" text-anchor="middle">A</text>
  <!-- 치수 -->
  <line class="th" x1="100" y1="76" x2="100" y2="44"/><line class="th" x1="420" y1="76" x2="420" y2="44"/>
  <line class="dm" x1="100" y1="52" x2="420" y2="52" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="260" y="38" text-anchor="middle">8,000 mm</text>
  <line class="th" x1="424" y1="80" x2="486" y2="80"/><line class="th" x1="424" y1="416" x2="486" y2="416"/>
  <line class="dm" x1="478" y1="80" x2="478" y2="416" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="488" y="252">8,400 mm</text>
  <!-- 구분 이름 -->
  <text class="tx" x="260" y="72" text-anchor="middle">( )</text>
  <text class="tx" x="260" y="440" text-anchor="middle">( )</text>
  <text class="tx" x="94" y="252" text-anchor="end">( )</text>
  <text class="tx" x="430" y="252" text-anchor="start">( )</text>
  <text class="tx" x="244" y="252" text-anchor="end">( )</text>
</svg>