<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 1: 위 힌지, 아래 고정, 2L (T=200, 바닥 340) -->
  <rect x="40" y="190" width="80" height="10" fill="url(#hat)"/>
  <line class="ln" x1="40" y1="200" x2="120" y2="200"/>
  <circle class="nd" cx="80" cy="206" r="5"/>
  <line class="m" x1="80" y1="211" x2="80" y2="340"/>
  <line class="ln" x1="40" y1="340" x2="120" y2="340"/>
  <rect x="40" y="340" width="80" height="10" fill="url(#hat)"/>
  <line class="th" x1="86" y1="200" x2="136" y2="200"/><line class="th" x1="86" y1="340" x2="136" y2="340"/>
  <line class="dm" x1="130" y1="200" x2="130" y2="340" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="138" y="276">2L</text>
  <text class="tx" x="72" y="384">(1)</text>
  <!-- 2: 양단 고정, 4L (T=60) -->
  <rect x="190" y="50" width="80" height="10" fill="url(#hat)"/>
  <line class="ln" x1="190" y1="60" x2="270" y2="60"/>
  <line class="m" x1="230" y1="60" x2="230" y2="340"/>
  <line class="ln" x1="190" y1="340" x2="270" y2="340"/>
  <rect x="190" y="340" width="80" height="10" fill="url(#hat)"/>
  <line class="th" x1="236" y1="60" x2="286" y2="60"/><line class="th" x1="236" y1="340" x2="286" y2="340"/>
  <line class="dm" x1="280" y1="60" x2="280" y2="340" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="288" y="206">4L</text>
  <text class="tx" x="222" y="384">(2)</text>
  <!-- 3: 아래 고정, 위 자유, L (T=270) -->
  <line class="m" x1="380" y1="270" x2="380" y2="340"/>
  <line class="ln" x1="340" y1="340" x2="420" y2="340"/>
  <rect x="340" y="340" width="80" height="10" fill="url(#hat)"/>
  <line class="th" x1="386" y1="270" x2="436" y2="270"/><line class="th" x1="386" y1="340" x2="436" y2="340"/>
  <line class="dm" x1="430" y1="270" x2="430" y2="340" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="440" y="312">L</text>
  <text class="tx" x="372" y="384">(3)</text>
  <!-- 4: 양단 힌지, L/2 (T=305) -->
  <rect x="490" y="295" width="80" height="10" fill="url(#hat)"/>
  <line class="ln" x1="490" y1="305" x2="570" y2="305"/>
  <circle class="nd" cx="530" cy="311" r="5"/>
  <line class="m" x1="530" y1="316" x2="530" y2="329"/>
  <circle class="nd" cx="530" cy="334" r="5"/>
  <line class="ln" x1="490" y1="340" x2="570" y2="340"/>
  <rect x="490" y="340" width="80" height="10" fill="url(#hat)"/>
  <line class="th" x1="576" y1="305" x2="606" y2="305"/><line class="th" x1="576" y1="340" x2="606" y2="340"/>
  <line class="dm" x1="600" y1="305" x2="600" y2="340" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="548" y="290">L/2</text>
  <text class="tx" x="522" y="384">(4)</text>
</svg>