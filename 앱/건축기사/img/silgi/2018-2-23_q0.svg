<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 기둥 A : 하단 고정, 상단 회전 구속·이동 자유 -->
  <rect class="sup" x="60" y="290" width="60" height="10"/>
  <rect x="60" y="300" width="60" height="10" fill="url(#hat)"/>
  <line class="m" x1="90" y1="290" x2="90" y2="80"/>
  <rect class="fl" x="68" y="62" width="44" height="18"/><rect class="ln" x="68" y="62" width="44" height="18"/>
  <path class="dsh" d="M90,290 C90,190 120,190 120,80"/>
  <line class="ln" x1="114" y1="46" x2="150" y2="46" marker-end="url(#ai)"/>
  <text class="tb" x="84" y="336">A</text>
  <!-- 기둥 B : 하단 힌지, 상단 회전 구속·이동 자유 -->
  <polygon class="sup" points="230,290 218,308 242,308"/>
  <rect x="206" y="308" width="48" height="8" fill="url(#hat)"/>
  <line class="m" x1="230" y1="290" x2="230" y2="80"/>
  <rect class="fl" x="208" y="62" width="44" height="18"/><rect class="ln" x="208" y="62" width="44" height="18"/>
  <path class="dsh" d="M230,290 C268,210 268,160 268,80"/>
  <line class="ln" x1="254" y1="46" x2="290" y2="46" marker-end="url(#ai)"/>
  <text class="tb" x="224" y="336">B</text>
  <!-- 기둥 C : 양단 고정 -->
  <rect class="sup" x="340" y="48" width="60" height="10"/>
  <rect x="340" y="38" width="60" height="10" fill="url(#hat)"/>
  <rect class="sup" x="340" y="290" width="60" height="10"/>
  <rect x="340" y="300" width="60" height="10" fill="url(#hat)"/>
  <line class="m" x1="370" y1="58" x2="370" y2="290"/>
  <path class="dsh" d="M370,290 C335,240 335,110 370,58"/>
  <text class="tb" x="364" y="336">C</text>
  <!-- 기둥 D : 하단 힌지, 상단 고정 -->
  <rect class="sup" x="500" y="48" width="60" height="10"/>
  <rect x="500" y="38" width="60" height="10" fill="url(#hat)"/>
  <polygon class="sup" points="530,290 518,308 542,308"/>
  <rect x="506" y="308" width="48" height="8" fill="url(#hat)"/>
  <line class="m" x1="530" y1="58" x2="530" y2="290"/>
  <path class="dsh" d="M530,290 C500,230 500,110 530,58"/>
  <text class="tb" x="524" y="336">D</text>
  <text class="ts" x="16" y="20">점선 = 좌굴 변형 · 사각 블록 = 상단 이동 자유(회전 구속)</text>
</svg>