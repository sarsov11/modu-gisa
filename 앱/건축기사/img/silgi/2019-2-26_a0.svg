<svg viewBox="0 0 620 440" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- (1) 등분포하중만 작용 : 처짐 δC1 아래로 -->
  <text class="tb" x="20" y="22">(1) 등분포하중 단독</text>
  <rect class="hl" x="60" y="40" width="500" height="30"/>
  <line class="ln" x1="60" y1="40" x2="560" y2="40"/>
  <line class="ld" x1="60" y1="40" x2="60" y2="77" marker-end="url(#ar)"/>
  <line class="ld" x1="122" y1="40" x2="122" y2="77" marker-end="url(#ar)"/>
  <line class="ld" x1="185" y1="40" x2="185" y2="77" marker-end="url(#ar)"/>
  <line class="ld" x1="247" y1="40" x2="247" y2="77" marker-end="url(#ar)"/>
  <line class="ld" x1="310" y1="40" x2="310" y2="77" marker-end="url(#ar)"/>
  <line class="ld" x1="372" y1="40" x2="372" y2="77" marker-end="url(#ar)"/>
  <line class="ld" x1="435" y1="40" x2="435" y2="77" marker-end="url(#ar)"/>
  <line class="ld" x1="497" y1="40" x2="497" y2="77" marker-end="url(#ar)"/>
  <line class="ld" x1="560" y1="40" x2="560" y2="77" marker-end="url(#ar)"/>
  <text class="tr" x="330" y="34">w = 2 kN/m</text>
  <line class="m" x1="60" y1="80" x2="560" y2="80"/>
  <path class="ln" fill="none" d="M60,80 Q310,180 560,80"/>
  <line class="dm" x1="310" y1="80" x2="310" y2="130" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tm" x="322" y="110">δ<tspan dy="4" class="ts">C1</tspan></text>
  <polygon class="sup" points="60,80 46,108 74,108"/>
  <line class="ln" x1="38" y1="108" x2="82" y2="108"/>
  <text class="tb" x="22" y="102">A</text>
  <polygon class="sup" points="560,80 546,104 574,104"/>
  <circle class="nd" cx="553" cy="108" r="4"/><circle class="nd" cx="567" cy="108" r="4"/>
  <line class="ln" x1="538" y1="112" x2="582" y2="112"/>
  <text class="tb" x="584" y="102">B</text>
  <!-- (2) 점 C 반력만 작용 : 처짐 δC2 위로 -->
  <line class="th" x1="20" y1="214" x2="600" y2="214"/>
  <text class="tb" x="20" y="240">(2) 반력 V<tspan dy="4" class="ts">C</tspan><tspan dy="-4"> 단독</tspan></text>
  <line class="m" x1="60" y1="340" x2="560" y2="340"/>
  <path class="ln" fill="none" d="M60,340 Q310,240 560,340"/>
  <line class="dm" x1="310" y1="290" x2="310" y2="340" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tm" x="322" y="320">δ<tspan dy="4" class="ts">C2</tspan></text>
  <polygon class="sup" points="60,340 46,368 74,368"/>
  <line class="ln" x1="38" y1="368" x2="82" y2="368"/>
  <text class="tb" x="22" y="362">A</text>
  <polygon class="sup" points="560,340 546,364 574,364"/>
  <circle class="nd" cx="553" cy="368" r="4"/><circle class="nd" cx="567" cy="368" r="4"/>
  <line class="ln" x1="538" y1="372" x2="582" y2="372"/>
  <text class="tb" x="584" y="362">B</text>
  <line class="ld" x1="310" y1="410" x2="310" y2="343" marker-end="url(#ar)"/>
  <text class="tr" x="322" y="408">V<tspan dy="4" class="ts">C</tspan></text>
  <text class="ts" x="20" y="432">δ<tspan dy="3">C1</tspan><tspan dy="-3"> = δ</tspan><tspan dy="3">C2</tspan><tspan dy="-3"> (적합조건)</tspan></text>
</svg>