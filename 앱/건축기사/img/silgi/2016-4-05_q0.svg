  <line class="ld" x1="470" y1="300" x2="396" y2="300" marker-end="url(#ar)"/><text class="tr" x="448" y="290"><tspan class="tm">H</tspan><tspan dy="4" class="ts">B</tspan></text>
  <line class="ld" x1="140" y1="410" x2="140" y2="328" marker-end="url(#ar)"/><text class="tr" x="112" y="426"><tspan class="tm">V</tspan><tspan dy="4" class="ts">A</tspan></text>
  <line class="ld" x1="380" y1="410" x2="380" y2="328" marker-end="url(#ar)"/><text class="tr" x="352" y="426"><tspan class="tm">V</tspan><tspan dy="4" class="ts">B</tspan></text>
