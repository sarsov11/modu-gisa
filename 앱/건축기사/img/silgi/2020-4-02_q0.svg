  <line class="th" x1="86" y1="150" x2="86" y2="214"/><line class="th" x1="286" y1="150" x2="286" y2="170"/><line class="th" x1="236" y1="150" x2="236" y2="214"/><line class="th" x1="386" y1="150" x2="386" y2="214"/><line class="th" x1="486" y1="150" x2="486" y2="214"/>
  <line class="dm" x1="86" y1="162" x2="286" y2="162" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
