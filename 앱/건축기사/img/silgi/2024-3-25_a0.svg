  <text class="tx" x="16" y="500">ΣM<tspan dy="4" class="ts">A</tspan><tspan dy="-4"> = 0 :  −R</tspan><tspan dy="4" class="ts">B</tspan><tspan dy="-4">×2 + 10×3 = 0 → R</tspan><tspan dy="4" class="ts">B</tspan><tspan dy="-4"> = 15 kN</tspan></text>
