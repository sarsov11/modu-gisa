<svg class="gk" viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg"><style>svg.gk{background:#FFFFFF}svg.gk .m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}svg.gk .ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}svg.gk .th{stroke:#5B6475;stroke-width:1.1;fill:none}svg.gk .dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}svg.gk .ld{stroke:#E0313A;stroke-width:1.8;fill:none}svg.gk .dm{stroke:#8C95A8;stroke-width:1.1;fill:none}svg.gk .crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}svg.gk .nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}svg.gk .rb{fill:#1F2533;stroke:none}svg.gk .fl{fill:#EEF1F6;stroke:none}svg.gk .hl{fill:#FDE7E8;stroke:none}svg.gk .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}svg.gk .tx,svg.gk .tb,svg.gk .ts,svg.gk .tr,svg.gk .tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}svg.gk .tb{font-weight:800}svg.gk .ts{font-size:12.5px;fill:#5B6475}svg.gk .tr{fill:#E0313A;font-weight:800}svg.gk .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 기준선 -->
  <line class="th" x1="60" y1="46" x2="60" y2="204"/>
  <line class="th" x1="220" y1="46" x2="220" y2="204"/>
  <line class="th" x1="260" y1="46" x2="260" y2="204"/>
  <line class="th" x1="340" y1="46" x2="340" y2="204"/>
  <line class="th" x1="420" y1="46" x2="420" y2="204"/>
  <text class="tb" x="60" y="34" text-anchor="middle">EST</text>
  <text class="tb" x="220" y="34" text-anchor="middle">LST</text>
  <text class="tb" x="260" y="34" text-anchor="middle" dy="16">EFT</text>
  <text class="tb" x="340" y="34" text-anchor="middle">후속 EST</text>
  <text class="tb" x="420" y="34" text-anchor="middle">LFT</text>
  <!-- 가장 이르게 -->
  <rect class="hl" x="60" y="62" width="200" height="28"/><rect class="ln" x="60" y="62" width="200" height="28" fill="none"/>
  <text class="tx" x="160" y="81" text-anchor="middle">가장 이르게 (소요일수)</text>
  <!-- 가장 늦게 -->
  <rect class="fl" x="220" y="98" width="200" height="28"/><rect class="dsh" x="220" y="98" width="200" height="28" fill="none"/>
  <text class="tx" x="320" y="117" text-anchor="middle">가장 늦게</text>
  <!-- 여유 -->
  <line class="dm" x1="260" y1="150" x2="420" y2="150" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tr" x="340" y="144" text-anchor="middle">TF = LFT − EFT</text>
  <line class="dm" x1="260" y1="176" x2="340" y2="176" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tr" x="300" y="170" text-anchor="middle">FF</text>
  <line class="dm" x1="340" y1="202" x2="420" y2="202" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tr" x="380" y="196" text-anchor="middle">DF</text>
  <text class="ts" x="60" y="180">FF = 후속 EST − EFT</text>
  <text class="ts" x="60" y="204">DF = TF − FF</text>
</svg>