<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- A : 하단 고정, 상단 자유(수평 이동) -->
  <rect class="sup" x="70" y="36" width="40" height="24"/>
  <rect class="dsh" x="132" y="36" width="40" height="24"/>
  <path class="dsh" d="M90,260 C92,180 130,150 152,62"/>
  <line class="m" x1="90" y1="60" x2="90" y2="260"/>
  <rect class="sup" x="60" y="260" width="60" height="8"/>
  <rect x="60" y="268" width="60" height="8" fill="url(#hat)"/>
  <text class="tb" x="90" y="308" text-anchor="middle">A</text>
  <!-- B : 하단 힌지, 상단 자유(수평 이동) -->
  <rect class="sup" x="210" y="36" width="40" height="24"/>
  <rect class="dsh" x="262" y="36" width="40" height="24"/>
  <path class="dsh" d="M230,244 C232,180 262,150 282,62"/>
  <line class="m" x1="230" y1="60" x2="230" y2="244"/>
  <polygon class="sup" points="230,244 216,266 244,266"/>
  <rect class="sup" x="200" y="266" width="60" height="8"/>
  <rect x="200" y="274" width="60" height="8" fill="url(#hat)"/>
  <text class="tb" x="230" y="308" text-anchor="middle">B</text>
  <!-- C : 양단 고정 -->
  <rect x="350" y="28" width="60" height="8" fill="url(#hat)"/>
  <rect class="sup" x="350" y="36" width="60" height="24"/>
  <path class="dsh" d="M380,60 C336,110 336,210 380,260"/>
  <line class="m" x1="380" y1="60" x2="380" y2="260"/>
  <rect class="sup" x="350" y="260" width="60" height="8"/>
  <rect x="350" y="268" width="60" height="8" fill="url(#hat)"/>
  <text class="tb" x="380" y="308" text-anchor="middle">C</text>
  <!-- D : 상단 고정, 하단 힌지 -->
  <rect x="490" y="28" width="60" height="8" fill="url(#hat)"/>
  <rect class="sup" x="490" y="36" width="60" height="24"/>
  <path class="dsh" d="M520,60 C572,110 566,200 520,244"/>
  <line class="m" x1="520" y1="60" x2="520" y2="244"/>
  <polygon class="sup" points="520,244 506,266 534,266"/>
  <rect class="sup" x="490" y="266" width="60" height="8"/>
  <rect x="490" y="274" width="60" height="8" fill="url(#hat)"/>
  <text class="tb" x="520" y="308" text-anchor="middle">D</text>
  <text class="ts" x="16" y="326">실선 = 기둥, 점선 = 좌굴 변형 형상</text>
</svg>