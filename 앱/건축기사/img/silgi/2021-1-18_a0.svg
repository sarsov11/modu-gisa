  <line class="th" x1="48" y1="50" x2="48" y2="330"/><line class="th" x1="92" y1="50" x2="92" y2="330"/>
  <!-- 보 플랜지 -->
  <rect class="fl" x="104" y="150" width="216" height="10"/><rect class="ln" x="104" y="150" width="216" height="10"/>
