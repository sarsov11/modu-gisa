<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <text class="tb" x="190" y="26" text-anchor="middle">맞댐용접</text>
  <text class="tb" x="540" y="26" text-anchor="middle">필릿(Fillet)용접</text>
  <line class="th" x1="360" y1="14" x2="360" y2="326"/>

  <!-- 맞댐용접: 개선(V홈) -->
  <polygon class="sup" points="30,140 150,140 183,170 183,200 30,200"/>
  <polygon class="sup" points="230,140 340,140 340,200 197,200 197,170"/>
  <path class="hl" d="M150,140 L183,170 L197,170 L230,140 Q190,112 150,140 Z"/>
  <path class="ln" d="M150,140 Q190,112 230,140"/>
  <line class="dsh" x1="150" y1="140" x2="230" y2="140"/>
  <!-- 홈의 각도 -->
  <line class="th" x1="150" y1="140" x2="128" y2="108"/><line class="th" x1="230" y1="140" x2="252" y2="108"/>
  <path class="dm" d="M132,114 Q190,72 248,114" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="190" y="62" text-anchor="middle">홈의 각도(개선각도)</text>
  <!-- 보강살붙임 -->
  <text class="tx" x="262" y="96">보강살붙임</text>
  <line class="ln" x1="300" y1="102" x2="212" y2="123" marker-end="url(#ai)"/>
  <!-- 목두께 -->
  <line class="dm" x1="190" y1="142" x2="190" y2="170" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="38" y="165">목두께</text>
  <line class="ln" x1="88" y1="160" x2="187" y2="156" marker-end="url(#ai)"/>
  <!-- 루트 -->
  <text class="tx" x="250" y="188">루트</text>
  <line class="ln" x1="248" y1="184" x2="199" y2="185" marker-end="url(#ai)"/>
  <!-- 루트간격 -->
  <line class="th" x1="183" y1="200" x2="183" y2="228"/><line class="th" x1="197" y1="200" x2="197" y2="228"/>
  <line class="dm" x1="183" y1="222" x2="197" y2="222" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="214" y="240">루트간격</text>
  <line class="ln" x1="212" y1="236" x2="200" y2="224" marker-end="url(#ai)"/>
  <text class="tx" x="190" y="302" text-anchor="middle">두 부재의 접합부를 일정한 모양으로 가공한 후</text>
  <text class="tx" x="190" y="324" text-anchor="middle">그 사이에 용착금속을 채워서 용접하는 방법</text>

  <!-- 필릿용접 -->
  <rect class="sup" x="380" y="180" width="324" height="70"/>
  <rect class="sup" x="450" y="50" width="50" height="130"/>
  <path class="hl" d="M500,130 L550,180 L500,180 Z"/>
  <path class="ln" d="M500,130 L550,180"/>
  <!-- 목두께 a -->
  <line class="ln" x1="500" y1="180" x2="525" y2="155" marker-end="url(#ai)"/>
  <text class="tx" x="580" y="76">목두께 <tspan class="tm">a</tspan></text>
  <line class="ln" x1="590" y1="82" x2="530" y2="150" marker-end="url(#ai)"/>
  <!-- 다리길이 h1 -->
  <line class="th" x1="500" y1="130" x2="598" y2="130"/><line class="th" x1="550" y1="180" x2="598" y2="180"/>
  <line class="dm" x1="592" y1="130" x2="592" y2="180" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="602" y="160"><tspan class="tm">h</tspan><tspan dy="4" class="ts">1</tspan></text>
  <line class="th" x1="550" y1="180" x2="550" y2="104"/><line class="th" x1="500" y1="130" x2="500" y2="104"/>
  <line class="dm" x1="500" y1="110" x2="550" y2="110" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="518" y="102"><tspan class="tm">h</tspan><tspan dy="4" class="ts">1</tspan></text>
  <!-- 이음의 뿌리 -->
  <text class="tx" x="400" y="274">이음의 뿌리</text>
  <line class="ln" x1="440" y1="260" x2="498" y2="184" marker-end="url(#ai)"/>
  <text class="tx" x="540" y="302" text-anchor="middle">두 부재를 일정한 각도로 접합한 후</text>
  <text class="tx" x="540" y="324" text-anchor="middle">삼각형 모양으로 접합부를 용접하는 방법</text>
</svg>