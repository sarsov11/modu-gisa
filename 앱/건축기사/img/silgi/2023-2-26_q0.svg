  <line class="m" x1="420" y1="200" x2="420" y2="250"/>
  <rect class="sup" x="396" y="250" width="48" height="8"/><rect x="396" y="258" width="48" height="8" fill="url(#hat)"/>
  <line class="dm" x1="460" y1="200" x2="460" y2="250" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="470" y="230">L</text>
