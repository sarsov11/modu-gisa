  <circle class="nd" cx="580" cy="225" r="5"/><circle class="nd" cx="580" cy="250" r="5"/>
  <rect class="sup" x="556" y="255" width="48" height="8"/><rect x="556" y="263" width="48" height="8" fill="url(#hat)"/>
  <line class="dm" x1="620" y1="225" x2="620" y2="250" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="630" y="242">L/2</text>
