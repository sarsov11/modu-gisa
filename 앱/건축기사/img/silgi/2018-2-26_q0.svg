<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 단면: 터파기 상부폭 1.2 m, 하부폭 0.8 m, 깊이 1.8 m (1 px = 1 cm) -->
  <polygon class="fl" points="70,70 190,70 170,250 90,250"/>
  <polyline class="m" points="20,70 70,70 90,250 170,250 190,70 240,70"/>
  <rect x="20" y="70" width="50" height="14" fill="url(#hat)"/>
  <rect x="190" y="70" width="50" height="14" fill="url(#hat)"/>
  <line class="th" x1="70" y1="70" x2="70" y2="46"/><line class="th" x1="190" y1="70" x2="190" y2="46"/>
  <line class="dm" x1="70" y1="52" x2="190" y2="52" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="104" y="42">1.2 m</text>
  <line class="th" x1="240" y1="70" x2="276" y2="70"/><line class="th" x1="170" y1="250" x2="276" y2="250"/>
  <line class="dm" x1="268" y1="70" x2="268" y2="250" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="282" y="165">1.8 m</text>
  <line class="th" x1="90" y1="250" x2="90" y2="276"/><line class="th" x1="170" y1="250" x2="170" y2="276"/>
  <line class="dm" x1="90" y1="270" x2="170" y2="270" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="104" y="294">0.8 m</text>
  <text class="tb" x="124" y="166">단면</text>
  <!-- 평면: 13 m x 7 m (1 px = 2 cm... 20 px/m) -->
  <rect class="fl" x="370" y="70" width="260" height="140"/>
  <rect class="ln" x="370" y="70" width="260" height="140"/>
  <text class="tb" x="480" y="146">평면</text>
  <line class="th" x1="370" y1="218" x2="370" y2="244"/><line class="th" x1="630" y1="218" x2="630" y2="244"/>
  <line class="dm" x1="370" y1="238" x2="630" y2="238" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="482" y="262">13 m</text>
  <line class="th" x1="636" y1="70" x2="656" y2="70"/><line class="th" x1="636" y1="210" x2="656" y2="210"/>
  <line class="dm" x1="650" y1="70" x2="650" y2="210" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="636" y="232">7 m</text>
</svg>