<svg class="gk" viewBox="0 0 620 310" xmlns="http://www.w3.org/2000/svg"><style>svg.gk{background:#FFFFFF}svg.gk .m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}svg.gk .ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}svg.gk .th{stroke:#5B6475;stroke-width:1.1;fill:none}svg.gk .dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}svg.gk .ld{stroke:#E0313A;stroke-width:1.8;fill:none}svg.gk .dm{stroke:#8C95A8;stroke-width:1.1;fill:none}svg.gk .crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}svg.gk .nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}svg.gk .rb{fill:#1F2533;stroke:none}svg.gk .fl{fill:#EEF1F6;stroke:none}svg.gk .hl{fill:#FDE7E8;stroke:none}svg.gk .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}svg.gk .tx,svg.gk .tb,svg.gk .ts,svg.gk .tr,svg.gk .tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}svg.gk .tb{font-weight:800}svg.gk .ts{font-size:12.5px;fill:#5B6475}svg.gk .tr{fill:#E0313A;font-weight:800}svg.gk .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 안방수: 방수층이 구조체 안쪽 -->
  <text class="tb" x="160" y="30" text-anchor="middle">안방수</text>
  <rect x="40" y="60" width="70" height="190" fill="url(#hat)"/>
  <rect class="fl" x="110" y="60" width="30" height="190"/><rect class="ln" x="110" y="60" width="30" height="190" fill="none"/>
  <rect class="fl" x="110" y="230" width="170" height="20"/><rect class="ln" x="110" y="230" width="170" height="20" fill="none"/>
  <line class="crit" x1="142" y1="62" x2="142" y2="227"/><line class="crit" x1="144" y1="227" x2="280" y2="227"/>
  <rect class="hl" x="146" y="62" width="10" height="160"/>
  <line class="ld" x1="46" y1="150" x2="106" y2="150" marker-end="url(#ar)"/><text class="tr" x="46" y="140">수압</text>
  <text class="ts" x="170" y="110">방수층</text><text class="ts" x="170" y="132">보호 누름(필요)</text>
  <text class="ts" x="160" y="278" text-anchor="middle">안쪽에서 시공, 수압이 작은 곳</text>
  <!-- 바깥방수: 방수층이 구조체 바깥쪽 -->
  <text class="tb" x="470" y="30" text-anchor="middle">바깥방수</text>
  <rect x="340" y="60" width="66" height="190" fill="url(#hat)"/>
  <rect class="fl" x="410" y="60" width="30" height="190"/><rect class="ln" x="410" y="60" width="30" height="190" fill="none"/>
  <rect class="fl" x="410" y="230" width="170" height="20"/><rect class="ln" x="410" y="230" width="170" height="20" fill="none"/>
  <line class="crit" x1="408" y1="62" x2="408" y2="254"/><line class="crit" x1="408" y1="254" x2="580" y2="254"/>
  <line class="ld" x1="346" y1="150" x2="404" y2="150" marker-end="url(#ar)"/><text class="tr" x="346" y="140">수압</text>
  <text class="ts" x="456" y="110">방수층은 바깥쪽</text><text class="ts" x="456" y="132">수압이 벽에 밀착(보호 불필요)</text>
  <text class="ts" x="470" y="278" text-anchor="middle">바깥에서 시공, 수압이 큰 곳</text>
</svg>