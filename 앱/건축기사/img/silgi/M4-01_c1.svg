<svg class="gk" viewBox="0 0 580 400" xmlns="http://www.w3.org/2000/svg"><style>svg.gk{background:#FFFFFF}svg.gk .m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}svg.gk .ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}svg.gk .th{stroke:#5B6475;stroke-width:1.1;fill:none}svg.gk .dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}svg.gk .ld{stroke:#E0313A;stroke-width:1.8;fill:none}svg.gk .dm{stroke:#8C95A8;stroke-width:1.1;fill:none}svg.gk .crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}svg.gk .nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}svg.gk .rb{fill:#1F2533;stroke:none}svg.gk .fl{fill:#EEF1F6;stroke:none}svg.gk .hl{fill:#FDE7E8;stroke:none}svg.gk .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}svg.gk .tx,svg.gk .tb,svg.gk .ts,svg.gk .tr,svg.gk .tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}svg.gk .tb{font-weight:800}svg.gk .ts{font-size:12.5px;fill:#5B6475}svg.gk .tr{fill:#E0313A;font-weight:800}svg.gk .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 좌: 1단 고정·타단 자유 기둥의 좌굴 형태 -->
  <rect class="sup" x="70" y="230" width="120" height="14"/>
  <rect x="70" y="244" width="120" height="14" fill="url(#hat)"/>
  <line class="m" x1="130" y1="230" x2="130" y2="80"/>
  <path class="ln" d="M130,230 C130,170 150,110 190,80" fill="none"/>
  <path class="dsh" d="M130,230 C130,290 150,350 190,380" fill="none"/>
  <line class="ld" x1="190" y1="38" x2="190" y2="76" marker-end="url(#ar)"/>
  <text class="tr" x="204" y="54">P</text>
  <text class="tb" x="60" y="224" text-anchor="end">고정</text>
  <text class="tb" x="206" y="96">자유</text>
  <!-- 치수 -->
  <line class="th" x1="62" y1="80" x2="124" y2="80"/>
  <line class="dm" x1="80" y1="80" x2="80" y2="230" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tm" x="26" y="160">L</text>
  <line class="th" x1="62" y1="380" x2="124" y2="380"/>
  <line class="dm" x1="44" y1="80" x2="44" y2="380" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tm" x="4" y="236">KL</text>
  <text class="ts" x="200" y="372">KL = 2L</text><text class="ts" x="200" y="390">(점선은 반파장으로 이은 가상 곡선)</text>
  <!-- 우: H형강 단면 -->
  <polygon class="fl" points="330,90 450,90 450,100 394,100 394,200 450,200 450,210 330,210 330,200 386,200 386,100 330,100"/>
  <polygon class="ln" points="330,90 450,90 450,100 394,100 394,200 450,200 450,210 330,210 330,200 386,200 386,100 330,100" fill="none"/>
  <line class="dsh" x1="310" y1="150" x2="474" y2="150"/>
  <text class="tb" x="482" y="156">X</text>
  <line class="dsh" x1="390" y1="70" x2="390" y2="232"/>
  <text class="tb" x="384" y="256">Y</text>
  <line class="th" x1="330" y1="216" x2="330" y2="240"/><line class="th" x1="450" y1="216" x2="450" y2="240"/>
  <line class="dm" x1="330" y1="234" x2="450" y2="234" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="ts" x="420" y="256">100</text>
  <text class="tb" x="390" y="296" text-anchor="middle">H-100×100×6×8</text>
  <text class="tx" x="390" y="324" text-anchor="middle">강축 I<tspan dy="4" class="ts">x</tspan><tspan dy="-4"> = 3.83×10⁶ mm⁴</tspan></text>
  <text class="tx" x="390" y="348" text-anchor="middle">약축 I<tspan dy="4" class="ts">y</tspan><tspan dy="-4"> = 1.34×10⁶ mm⁴ (작은 값)</tspan></text>
  <text class="ts" x="390" y="372" text-anchor="middle">좌굴은 작은 I 쪽(약축)으로 일어난다</text>
</svg>