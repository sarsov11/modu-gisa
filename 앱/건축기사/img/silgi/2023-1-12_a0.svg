  <line class="th" x1="150" y1="178" x2="150" y2="210"/><line class="th" x1="290" y1="178" x2="290" y2="230"/><line class="th" x1="350" y1="178" x2="350" y2="230"/><line class="th" x1="490" y1="178" x2="490" y2="210"/>
  <line class="dm" x1="150" y1="204" x2="290" y2="204" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="350" y1="204" x2="490" y2="204" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="290" y1="224" x2="350" y2="224" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tm" x="212" y="198">x<tspan dy="4" class="ts">1</tspan></text>
  <text class="tm" x="412" y="198">x<tspan dy="4" class="ts">2</tspan></text>
  <text class="tm" x="312" y="246">b<tspan dy="4" class="ts">w</tspan></text>
  <text class="ts" x="24" y="268">유효폭 = 세 값 중 작은 값 (빗금 부분)</text>
</svg>