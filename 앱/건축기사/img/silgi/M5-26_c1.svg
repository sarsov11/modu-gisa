  <text class="tx" x="168" y="80">0.5B 벽돌</text>
  <line class="th" x1="100" y1="40" x2="60" y2="40"/><line class="th" x1="100" y1="224" x2="60" y2="224"/><line class="th" x1="100" y1="250" x2="60" y2="250"/>
  <line class="dm" x1="68" y1="40" x2="68" y2="224" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="68" y1="224" x2="68" y2="250" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
