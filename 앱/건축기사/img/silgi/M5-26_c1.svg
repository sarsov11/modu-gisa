  <rect class="sup" x="100" y="40" width="30" height="210"/>
  <polyline class="crit" points="460,251 126,251 126,40"/>
  <text class="tb" x="140" y="150">방수층</text>
  <line class="th" x1="160" y1="156" x2="130" y2="190" marker-end="url(#ai)"/>
