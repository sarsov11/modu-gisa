<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모의고사 — 모두의 화약류관리기사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<link rel="stylesheet" href="css/q.css">
<link rel="stylesheet" href="css/tera-q.css">
<script>try{var _s=localStorage.getItem("modugisa2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
</head><body>
<div class="page">
  <div class="hd"><h1 id="ttl">모의고사</h1></div>
  <div id="stage"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/gquiz.js"></script>
<script src="js/judge.js"></script>
<script src="js/gstore.js"></script>
<script src="js/qlib.js"></script>
<script src="js/tera-q.js"></script>
<script src="js/tera-pad.js"></script>
<script src="js/qframe.js"></script>
<script>
(function(){
  var D=GS.D, e=GS.esc, M=QL.M, 유형=M.유형||GS.갈래||"기사";
  function el(x){return document.getElementById(x);}
  var 진행중=false;
  GS.내비("exam.html");

  /* 구성: 실제 시험 구조(과목·과목별 문항수)대로, 그림 없는 현행 문항만 */
  function 구성(){
    var 칸=[], 과목들=(M.과목&&M.과목.length)?M.과목:[["전체",60]];
    과목들.forEach(function(g){
      var 이름=g[0], n=g[1];
      var 풀=QL.Q.filter(function(x){return (이름==="전체"||x.s===이름) && !x.v && !QL.밖(x);});
      칸.push({n:이름, 목표:n, 문제:QL.뽑기(풀,n)});
    });
    return 칸;
  }
  function 분(총){ return Math.ceil(총*(M.분율||1.5)); }
  function 전체수(칸){ return 칸.reduce(function(a,c){return a+c.문제.length;},0); }

  /* 시작 화면 */
  function 시작화면(){
    var 칸=구성(), 총=전체수(칸);
    var 기록=(GS.S.모의||[]).slice(-3).reverse();
    var h='<div class="spec"><div><b>'+총+'</b><span>문항</span></div><div><b>'+분(총)+'</b><span>분</span></div>'+
      '<div><b>'+(유형==="기능사"?"60":"60 · 40")+'</b><span>'+(유형==="기능사"?"합격점":"평균 · 과락")+'</span></div></div>';
    h+='<div class="sub">'+칸.map(function(c){
      return '<div class="r"><b>'+e(QL.이름(c.n))+'</b><em>'+c.문제.length+(c.문제.length<c.목표?' / '+c.목표:'')+'</em></div>';
    }).join("")+'</div>';
    if(!총){ el("stage").innerHTML='<div class="none">문항 없음</div>'; return; }
    h+='<button class="b main" id="st">시작</button>';
    if(기록.length) h+='<div class="lab">최근 기록</div><div class="hist">'+기록.map(function(r){
      return '<div class="r"><span class="pl '+(r.합?"pass":"fail")+'">'+(r.합?"합격":"불합격")+'</span><span>'+e(r.t)+'</span><em>'+r.평균+'</em></div>';
    }).join("")+'</div>';
    h+='<div class="b2"><a class="b" href="quiz.html">기출</a><a class="b" href="index.html">오늘</a></div>';
    el("stage").innerHTML=h;
    el("st").onclick=function(){ 치르기(칸); };
  }

  /* 시험 */
  function 치르기(칸){
    진행중=true; GS.안쪽("모의고사",true);
    var 문제=[]; 칸.forEach(function(c,ci){ c.문제.forEach(function(x){ 문제.push({x:x,과목:ci,순:QL.보기섞기(x),고름:null,헷:false}); }); });
    var 총=문제.length, 제한=분(총)*60, 시작=Date.now(), 끝났나=false, 지금=0, 표열림=false, 제출대기=false;
    var 바=document.querySelector(".gtabs"); if(바) 바.style.display="none";
    function 남음(){ return Math.max(0,제한-Math.floor((Date.now()-시작)/1000)); }
    function 시간글(s){ var m=Math.floor(s/60), r=s%60; return (m<10?"0":"")+m+":"+(r<10?"0":"")+r; }
    function 답수(){ return 문제.filter(function(q){return q.고름!=null;}).length; }

    function 그리기(){
      var q=문제[지금], x=q.x, 과=칸[q.과목];
      var t0=GS.테마맵[x.k]||null;
      QF.펜숨김(); GS.안쪽(QL.이름(과.n),true);
      GS.진행표시(시간글(남음()));
      var 안=답수();
      var 행=문제.map(function(z,j){
        var 보=""; for(var c=0;c<z.x.c.length;c++) 보+='<i class="'+(z.고름===c?"is-on":"")+'">'+(c+1)+'</i>';
        return '<div class="tq-omr-row'+(j===지금?" is-now":"")+(z.고름==null?" is-todo":"")+'" data-g="'+j+'"><span class="tq-qn">'+(j+1)+'번</span>'+보+'</div>';
      }).join("");
      el("stage").innerHTML='<div class="tq-wrap has-omr"><main>'+QF.진행(안,총)+QF.번호줄(지금+1)+
        '<p class="tq-stem">'+e(x.q)+'</p>'+
        '<div class="padslot"></div>'+
        '<ul class="tq-choices" id="ch">'+q.순.map(function(o,j){
          return '<li><button class="tq-choice'+(q.고름===j?' is-pick':'')+'" data-j="'+j+'"><span class="tq-n">'+(j+1)+'</span><span class="tq-t">'+e(GS.깨끗(x.c[o]))+'</span></button></li>';
        }).join("")+'</ul></main>'+
        '<aside class="tq-omr'+(표열림?' is-open':'')+'" id="omr"><span id="jp"></span>'+행+
        '<div style="margin-top:12px"><button class="b" id="sb" style="width:100%">'+(제출대기?'미응답 '+(총-안)+' · 제출 확정':'지금 제출')+'</button></div></aside></div>';
      QF.번호줄채우기(t0&&t0.g); QF.밑줄(document.querySelectorAll(".tq-stem,.tq-t"));
      if(window.TERA_Q) TERA_Q.jump(el("jp"),{count:총-안,onClick:function(){ var j=문제.findIndex(function(z){return z.고름==null;}); if(j>=0){ 지금=j; 제출대기=false; 그리기(); window.scrollTo(0,0); } }});
      var gtb=document.getElementById("gtb");
      if(!gtb){ gtb=document.createElement("button"); gtb.id="gtb"; gtb.type="button"; gtb.className="gtb"; gtb.textContent="문항표";
        var gi=document.querySelector(".g-in"); if(gi) gi.insertBefore(gtb,document.getElementById("gpr")); }
      function 판열기(){ 표열림=!표열림; var o=el("omr"); if(o) o.classList.toggle("is-open",표열림); }
      gtb.onclick=판열기;
      GS.풀이창(document.querySelector(".padslot"), x.q+" "+(x.c||[]).join(" "), 과.n||x.s||"", x.id, QL.이름(과.n||x.s));
      document.querySelectorAll("#ch button").forEach(function(b){
        b.onclick=function(){ q.고름=Number(b.dataset.j); 제출대기=false; 그리기(); };
      });
      QF.바({도구:[{id:"conf",icon:"help",글:"헷갈림",켜짐:q.헷,fn:function(){ q.헷=!q.헷; 그리기(); }},{id:"pen",icon:"pen",글:"펜",fn:function(){ QF.펜(x.id); }}],
        위치:String(지금+1),총:String(총),
        이전:지금>0?function(){ 지금--; 제출대기=false; 그리기(); window.scrollTo(0,0); }:null,
        번호판:판열기,다음글:(지금+1<총?"다음":"제출"),
        다음:function(){ if(지금+1<총){ 지금++; 제출대기=false; 그리기(); window.scrollTo(0,0);} else 제출하기(); }});
      if(el("sb")) el("sb").onclick=제출하기;
      document.querySelectorAll(".tq-omr-row").forEach(function(r){ r.onclick=function(){ 지금=Number(r.dataset.g); 표열림=false; 그리기(); window.scrollTo(0,0); }; });
    }
    function 제출하기(){
      if(!제출대기 && 답수()<총){ 제출대기=true; 그리기(); return; }
      채점();
    }
    var 타이머=setInterval(function(){
      if(끝났나) return clearInterval(타이머);
      var r=남음(); GS.진행표시(시간글(r)+" · "+(지금+1)+" / "+총);
      var gp=document.getElementById("gpr"); if(gp) gp.classList.toggle("low",r<=300);
      if(r<=0) 채점();
    },1000);

    function 채점(){
      if(끝났나) return; 끝났나=true; 진행중=false; clearInterval(타이머);
      var _g=document.getElementById("gtb"); if(_g) _g.remove(); QF.펜숨김(); var _b=document.getElementById("qf-bar"); if(_b) _b.remove(); document.body.classList.remove("has-tqbar");
      GS.안쪽("",false); GS.진행표시("");
      var 과목들=칸.map(function(c,ci){
        var 내=문제.filter(function(z){return z.과목===ci;});
        var 맞=내.filter(function(z){return z.고름!=null && z.순[z.고름]===z.x.a-1;}).length;
        var 점=QL.점수(맞,내.length);
        return {n:c.n, 맞:맞, 총:내.length, 점:점, 락:(유형!=="기능사" && 내.length && 점<40)?1:0};
      }).filter(function(s){return s.총;});
      var 판=QL.판정(과목들,유형);
      var 총맞=과목들.reduce(function(a,s){return a+s.맞;},0);
      var 쓴분=Math.max(1,Math.round((Date.now()-시작)/60000));
      /* 절반 넘게 비운 제출은 비운 문항을 오답 기록으로 남기지 않는다 — 1문항만 풀고 낸 시험이 99개 오답이 되던 것(2026-10-13 외부 검수 부가) */
      var 반영=답수()*2>=총;
      문제.forEach(function(z){ if(z.고름==null && !반영) return; QL.기록(z.x.id, z.고름!=null && z.순[z.고름]===z.x.a-1, z.헷?"half":"sure"); });
      /* 답:답한 문항 수 — 절반 미만이면 합격 가늠에서 뺀다(GS.시험성적, 2026-10-11 외부 검수) */
      var rec={t:GS.오늘(), ts:Date.now(), 종목:D.종목, 유형:유형, 합:판.합, 평균:판.평균, 총맞:총맞, 총문:총, 답:답수(), 분:쓴분,
               통과선:판.통과선, 과락선:판.과락선, 과목:과목들};
      GS.S.모의=(GS.S.모의||[]).concat([rec]).slice(-30); GS.저장();
      window.__결과=rec;
      결과(문제,과목들,판,총맞,총,쓴분);
    }
    그리기();
  }

  /* 결과 */
  function 결과(문제,과목들,판,총맞,총,쓴분){
    var 틀=문제.filter(function(z){return z.고름==null || z.순[z.고름]!==z.x.a-1;});
    var 큰=유형==="기능사" ? '<strong>'+판.평균+' / 60</strong>' : '<strong>평균 '+판.평균+' / 60</strong>';
    var h='<div class="big"><span class="pl '+(판.합?"pass":"fail")+'">'+(판.합?"합격":"불합격")+'</span>'+큰+'</div>';
    var 비운=문제.filter(function(z){return z.고름==null;}).length;
    if(비운*2>총) h+='<p style="margin:8px 0 0;font-size:14px;color:var(--ink-3)">답하지 않은 문항 '+비운+'개. 절반 넘게 비워서 합격 가늠에는 넣지 않음</p>';
    h+='<div class="tally"><div><b>'+총맞+' / '+총+'</b><span>정답</span></div><div><b>'+틀.length+'</b><span>오답</span></div><div><b>'+쓴분+'</b><span>분</span></div></div>';
    if(유형!=="기능사") h+='<div class="sub">'+과목들.map(function(s){
      return '<div class="r'+(s.락?' lk2':'')+'"><b>'+e(QL.이름(s.n))+(s.락?'<span class="pl lock">과락</span>':'')+'</b><em>'+s.점+'점</em>'+
        '<div class="bar"><i style="width:'+Math.min(100,s.점)+'%"></i></div></div>';
    }).join("")+'</div>';
    h+='<div class="act"><a class="b main" href="quiz.html?wrong=1">복습 <span style="margin-left:6px">'+QL.틀린것().length+'</span></a>'+
       '<div class="b2"><a class="b" href="exam.html">다시</a><a class="b" href="index.html">오늘</a></div></div>';
    if(틀.length){
      h+='<div class="lab">오답</div>';
      h+=틀.map(function(z,j){
        var x=z.x, t=GS.테마맵[x.k];
        var 맞칸=z.순.indexOf(x.a-1);
        return '<details class="fold"><summary>'+(j+1)+' · '+e(QL.이름(x.s))+(z.고름==null?' <span class="pl" style="margin-left:6px">무응답</span>':'')+'</summary><div class="in">'+
          '<p class="qstem" style="font-size:16px">'+e(x.q)+'</p>'+
          '<div class="ch" style="margin-top:12px">'+z.순.map(function(o,c){
            var cls=c===맞칸?"ans":(c===z.고름?"wrong":"");
            return '<button disabled class="'+cls+'"><span class="n">'+QL.번호[c]+'</span><span>'+e(GS.깨끗(x.c[o]))+'</span></button>';
          }).join("")+'</div>'+
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pl">정답 '+QL.번호[맞칸]+'</span>'+(x.r!=null?'<span class="pl">정답률 '+x.r+'%</span>':'')+
          (x.y?'<span class="pl">'+e(x.y)+'</span>':'')+'</div>'+
          (x.k&&t?'<div class="vd" style="margin:12px 0 0;background:none;border:0;padding:0"><div class="lk">'+(GS.옥수(x.k)>0?'<a href="ox.html?k='+encodeURIComponent(x.k)+'">O·X</a>':'')+(GS.개념있음(x.k)?'<a href="card.html?k='+encodeURIComponent(x.k)+'">개념</a>':'')+'</div></div>':'')+
        (window.TerraBeta&&TerraBeta.report?'<button type="button" class="b sm rp" data-i="'+j+'" style="margin-top:10px">이 문항 신고</button>':'')+
        '</div></details>';
      }).join("");
    }
    el("stage").innerHTML=h;
    /* 오류 신고 — 문항 ID·과목·유형이 자동으로 붙는다(2026-10-13 외부 검수 G) */
    Array.prototype.forEach.call(document.querySelectorAll("#stage .rp"),function(b){
      b.onclick=function(){ var x=틀[+b.getAttribute("data-i")].x; TerraBeta.report({app:"modu-gisa", 종목:D.종목, id:x.id, 과목:x.s||"", 테마:x.k||"", 유형:"모의고사", 화면:"exam"}); };
    });
    if(window.ZZ&&총>0){ var _p=총맞/총; ZZ.stars(_p>=1?3:_p>=.7?2:_p>=.4?1:0); }
    var 바=document.querySelector(".gtabs"); if(바) 바.style.display="";
    window.scrollTo(0,0);
  }

  window.addEventListener("beforeunload",function(ev){ if(진행중){ ev.preventDefault(); ev.returnValue=""; } });
  시작화면();
})();
</script>
<script src="js/zzsfx.js?v=1009a" defer></script><script src="js/zzajan.js?v=1013a" defer></script><script src="https://sarsov11.github.io/terra-learning/beta/beta.js" data-app="gisa" defer></script>
