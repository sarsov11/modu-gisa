<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .cn{font-size:1.4em;font-family:'Noto Sans KR','Malgun Gothic',sans-serif} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 바닥 -->
  <line class="m" x1="20" y1="384" x2="660" y2="384"/><rect x="20" y="384" width="640" height="10" fill="url(#hat)"/>
  <!-- 수원 -->
  <rect class="fl" x="20" y="334" width="90" height="48"/><rect class="ln" x="20" y="334" width="90" height="48"/>
  <line class="th" x1="20" y1="334" x2="110" y2="382"/><line class="th" x1="110" y1="334" x2="20" y2="382"/>
  <text class="tx" x="46" y="322">수원</text>
  <!-- 흡입측: 7 개폐밸브, 8 체크밸브, 압력계 -->
  <line class="m" x1="110" y1="358" x2="310" y2="358"/>
  <polygon class="sup" points="140,350 150,358 140,366"/><polygon class="sup" points="160,350 150,358 160,366"/>
  <polygon class="sup" points="200,350 200,366 222,358"/><line class="ln" x1="222" y1="350" x2="222" y2="366"/>
  <circle class="nd" cx="150" cy="330" r="10"/><text class="tb" x="150" y="335" text-anchor="middle">7</text>
  <circle class="nd" cx="211" cy="330" r="10"/><text class="tb" x="211" y="335" text-anchor="middle">8</text>
  <line class="th" x1="268" y1="358" x2="268" y2="334"/><circle class="nd" cx="268" cy="322" r="12"/>
  <!-- 펌프 -->
  <polygon class="sup" points="310,384 350,384 344,372 316,372"/>
  <circle class="nd" cx="330" cy="358" r="20"/><text class="tb" x="330" y="364" text-anchor="middle">P</text>
  <text class="tx" x="360" y="364">펌프</text>
  <!-- 토출측 입상관 -->
  <line class="m" x1="330" y1="338" x2="330" y2="52"/>
  <path class="ln" d="M322,52 Q330,40 338,52"/>
  <!-- 릴리프밸브 -->
  <polyline class="ln" points="330,262 300,262 300,278"/>
  <polygon class="rb" points="290,278 310,278 300,294"/><line class="ln" x1="290" y1="304" x2="310" y2="288"/>
  <text class="tx" x="196" y="274">릴리프</text><text class="tx" x="204" y="294">밸브</text>
  <!-- 6 압력계 -->
  <polyline class="th" points="330,236 300,236 300,214"/><circle class="nd" cx="300" cy="200" r="14"/><line class="th" x1="290" y1="210" x2="310" y2="190"/>
  <circle class="nd" cx="262" cy="200" r="10"/><text class="tb" x="262" y="205" text-anchor="middle">6</text>
  <!-- 2 체크밸브, 1 개폐밸브 -->
  <polygon class="sup" points="322,140 338,140 330,122"/><line class="ln" x1="322" y1="122" x2="338" y2="122"/>
  <polygon class="sup" points="322,82 338,82 330,92"/><polygon class="sup" points="322,102 338,102 330,92"/>
  <line class="ld" x1="296" y1="150" x2="296" y2="118" marker-end="url(#ar)"/>
  <circle class="nd" cx="372" cy="130" r="10"/><text class="tb" x="372" y="135" text-anchor="middle">2</text>
  <circle class="nd" cx="372" cy="92" r="10"/><text class="tb" x="372" y="97" text-anchor="middle">1</text>
  <!-- 성능시험배관 -->
  <line class="m" x1="330" y1="290" x2="630" y2="290"/>
  <polyline class="m" points="630,290 630,340"/>
  <line class="ld" x1="630" y1="326" x2="630" y2="352" marker-end="url(#ar)"/>
  <polygon class="sup" points="400,282 410,290 400,298"/><polygon class="sup" points="420,282 410,290 420,298"/>
  <polygon class="sup" points="550,282 560,290 550,298"/><polygon class="sup" points="570,282 560,290 570,298"/>
  <line class="th" x1="485" y1="290" x2="485" y2="262"/><circle class="nd" cx="485" cy="248" r="14"/><text class="tb" x="485" y="254" text-anchor="middle">M</text>
  <circle class="nd" cx="410" cy="262" r="10"/><text class="tb" x="410" y="267" text-anchor="middle">3</text>
  <circle class="nd" cx="560" cy="262" r="10"/><text class="tb" x="560" y="267" text-anchor="middle">4</text>
  <circle class="nd" cx="485" cy="210" r="10"/><text class="tb" x="485" y="215" text-anchor="middle">5</text>
</svg>