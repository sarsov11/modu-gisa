  <line class="th" x1="96" y1="70" x2="344" y2="70"/>
  <line class="th" x1="150" y1="82" x2="290" y2="82"/><line class="th" x1="180" y1="92" x2="260" y2="92"/><line class="th" x1="206" y1="102" x2="234" y2="102"/>
