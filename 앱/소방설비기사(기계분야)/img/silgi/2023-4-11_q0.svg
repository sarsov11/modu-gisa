  <rect class="sup" x="233" y="486" width="14" height="12"/><rect class="fl" x="229" y="500" width="22" height="76" rx="10"/><rect class="ln" x="229" y="500" width="22" height="76" rx="10"/>
  <polyline class="dsh" points="171,486 171,430 188,430 188,404 172,404"/>
