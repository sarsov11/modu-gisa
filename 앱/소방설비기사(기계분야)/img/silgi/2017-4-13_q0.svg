  <line class="ln" x1="90" y1="125" x2="90" y2="90"/><polygon class="sup" points="83,90 97,90 90,76"/><text class="tx" x="98" y="82">H-2</text>
  <line class="ln" x1="120" y1="145" x2="120" y2="110"/><polygon class="sup" points="113,110 127,110 120,96"/><text class="tx" x="128" y="102">H-3</text>
  <line class="ln" x1="150" y1="165" x2="150" y2="130"/><polygon class="sup" points="143,130 157,130 150,116"/><text class="tx" x="158" y="122">H-4</text>
  <line class="ln" x1="180" y1="185" x2="180" y2="150"/><polygon class="sup" points="173,150 187,150 180,136"/><text class="tx" x="188" y="142">H-5</text>
  <!-- B, A 지점 -->
  <circle class="nd" cx="206" cy="201" r="11"/><text class="tb" x="206" y="206" text-anchor="middle">B</text>
  <circle class="nd" cx="250" cy="262" r="11"/><text class="tb" x="250" y="267" text-anchor="middle">A</text>
