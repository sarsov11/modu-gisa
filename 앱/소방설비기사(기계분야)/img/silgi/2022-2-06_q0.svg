<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 위험물저장탱크: 앞면, 윗면, 옆면 -->
  <rect class="fl" x="70" y="140" width="140" height="105"/>
  <polygon class="fl" points="70,140 114,114 254,114 210,140"/>
  <polygon class="fl" points="210,140 254,114 254,219 210,245"/>
  <rect class="ln" x="70" y="140" width="140" height="105"/>
  <polyline class="ln" points="70,140 114,114 254,114 254,219 210,245"/>
  <line class="ln" x1="210" y1="140" x2="254" y2="114"/>
  <text class="tb" x="140" y="198" text-anchor="middle">위험물 저장탱크</text>
  <!-- 분사헤드 배관 -->
  <polyline class="m" points="92,92 192,92 236,78"/>
  <line class="m" x1="92" y1="92" x2="136" y2="78"/><line class="m" x1="136" y1="78" x2="236" y2="78"/>
  <polyline class="m" points="164,78 164,36"/>
  <path class="ln" d="M164,36 q8,-12 16,0 t16,0"/>
  <!-- 분사헤드 4개, 아래로 방사 -->
  <circle class="rb" cx="92" cy="92" r="5"/><line class="ld" x1="92" y1="98" x2="92" y2="132" marker-end="url(#ar)"/>
  <circle class="rb" cx="192" cy="92" r="5"/><line class="ld" x1="192" y1="98" x2="192" y2="132" marker-end="url(#ar)"/>
  <circle class="rb" cx="136" cy="78" r="5"/><line class="ld" x1="136" y1="84" x2="136" y2="108" marker-end="url(#ar)"/>
  <circle class="rb" cx="236" cy="78" r="5"/><line class="ld" x1="236" y1="84" x2="236" y2="108" marker-end="url(#ar)"/>
  <text class="ts" x="270" y="70">분사헤드 4개</text>
  <!-- 치수: 가로 2 m, 높이 1.5 m, 깊이 1 m -->
  <line class="th" x1="70" y1="250" x2="70" y2="284"/><line class="th" x1="210" y1="250" x2="210" y2="284"/>
  <line class="dm" x1="70" y1="276" x2="210" y2="276" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="140" y="300" text-anchor="middle">2 m</text>
  <line class="th" x1="34" y1="140" x2="66" y2="140"/><line class="th" x1="34" y1="245" x2="66" y2="245"/>
  <line class="dm" x1="44" y1="140" x2="44" y2="245" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="2" y="198">1.5 m</text>
  <line class="th" x1="214" y1="250" x2="228" y2="264"/><line class="th" x1="258" y1="224" x2="272" y2="238"/>
  <line class="dm" x1="224" y1="260" x2="268" y2="234" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="276" y="250">1 m</text>
</svg>