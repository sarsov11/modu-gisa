<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 변압기 본체: 앞면, 윗면, 옆면 -->
  <rect class="fl" x="70" y="60" width="180" height="84"/>
  <polygon class="fl" points="70,60 130,24 310,24 250,60"/>
  <polygon class="fl" points="250,60 310,24 310,108 250,144"/>
  <!-- 자갈 부분 -->
  <rect x="70" y="144" width="180" height="22" fill="url(#hat)"/>
  <polygon points="250,144 310,108 310,130 250,166" fill="url(#hat)"/>
  <rect class="ln" x="70" y="60" width="180" height="106"/>
  <line class="ln" x1="70" y1="144" x2="250" y2="144"/>
  <polyline class="ln" points="70,60 130,24 310,24 310,130 250,166"/>
  <line class="ln" x1="250" y1="60" x2="310" y2="24"/>
  <line class="ln" x1="250" y1="144" x2="310" y2="108"/>
  <text class="tb" x="160" y="108" text-anchor="middle">절연유 봉입변압기</text>
  <!-- 자갈 지시 -->
  <line class="th" x1="282" y1="140" x2="340" y2="92"/>
  <text class="tx" x="344" y="92">자갈</text>
  <!-- 높이 1.5 m, 0.4 m -->
  <line class="th" x1="36" y1="60" x2="70" y2="60"/><line class="th" x1="36" y1="144" x2="70" y2="144"/><line class="th" x1="36" y1="166" x2="70" y2="166"/>
  <line class="dm" x1="46" y1="60" x2="46" y2="144" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="46" y1="144" x2="46" y2="166" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="2" y="108">1.5 m</text>
  <text class="tx" x="2" y="159">0.4 m</text>
  <!-- 가로 5 m -->
  <line class="th" x1="70" y1="170" x2="70" y2="204"/><line class="th" x1="250" y1="170" x2="250" y2="204"/>
  <line class="dm" x1="70" y1="196" x2="250" y2="196" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="160" y="222" text-anchor="middle">5 m</text>
  <!-- 깊이 3 m -->
  <line class="th" x1="254" y1="170" x2="268" y2="184"/><line class="th" x1="314" y1="134" x2="328" y2="148"/>
  <line class="dm" x1="264" y1="180" x2="324" y2="144" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="316" y="176">3 m</text>
</svg>