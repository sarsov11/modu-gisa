<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 건물 외벽과 실 구획 -->
  <rect class="fl" x="40" y="60" width="360" height="300"/>
  <rect class="m" x="40" y="60" width="360" height="300"/>
  <polyline class="ln" points="40,270 190,270 190,180 40,180"/>
  <text class="tb" x="115" y="316" text-anchor="middle">A실</text>
  <text class="ts" x="115" y="336" text-anchor="middle">급기가압</text>
  <!-- A1: A실 - 작은 실, Q1 -->
  <line class="crit" x1="92" y1="270" x2="138" y2="270"/><line class="th" x1="92" y1="262" x2="92" y2="278"/><line class="th" x1="138" y1="262" x2="138" y2="278"/>
  <text class="tm" x="146" y="292">A<tspan dy="4" class="ts">1</tspan></text>
  <line class="ld" x1="115" y1="258" x2="115" y2="224" marker-end="url(#ar)"/>
  <text class="tm" x="124" y="238">Q<tspan dy="4" class="ts">1</tspan></text>
  <!-- A2: 작은 실 - 큰 실(오른쪽), Q2 -->
  <line class="crit" x1="190" y1="202" x2="190" y2="248"/><line class="th" x1="182" y1="202" x2="198" y2="202"/><line class="th" x1="182" y1="248" x2="198" y2="248"/>
  <text class="tm" x="160" y="230">A<tspan dy="4" class="ts">2</tspan></text>
  <line class="ld" x1="198" y1="225" x2="250" y2="225" marker-end="url(#ar)"/>
  <text class="tm" x="256" y="230">Q<tspan dy="4" class="ts">2</tspan></text>
  <!-- A3: 작은 실 - 큰 실(위), Q3 -->
  <line class="crit" x1="92" y1="180" x2="138" y2="180"/><line class="th" x1="92" y1="172" x2="92" y2="188"/><line class="th" x1="138" y1="172" x2="138" y2="188"/>
  <text class="tm" x="146" y="202">A<tspan dy="4" class="ts">3</tspan></text>
  <line class="ld" x1="115" y1="168" x2="115" y2="134" marker-end="url(#ar)"/>
  <text class="tm" x="124" y="148">Q<tspan dy="4" class="ts">3</tspan></text>
  <!-- A4, A5: 오른쪽 외벽, Q4 Q5 -->
  <line class="crit" x1="400" y1="262" x2="400" y2="308"/><line class="th" x1="392" y1="262" x2="408" y2="262"/><line class="th" x1="392" y1="308" x2="408" y2="308"/>
  <text class="tm" x="364" y="290">A<tspan dy="4" class="ts">4</tspan></text>
  <line class="ld" x1="410" y1="285" x2="462" y2="285" marker-end="url(#ar)"/>
  <text class="tm" x="468" y="290">Q<tspan dy="4" class="ts">4</tspan></text>
  <line class="crit" x1="400" y1="132" x2="400" y2="178"/><line class="th" x1="392" y1="132" x2="408" y2="132"/><line class="th" x1="392" y1="178" x2="408" y2="178"/>
  <text class="tm" x="364" y="160">A<tspan dy="4" class="ts">5</tspan></text>
  <line class="ld" x1="410" y1="155" x2="462" y2="155" marker-end="url(#ar)"/>
  <text class="tm" x="468" y="160">Q<tspan dy="4" class="ts">5</tspan></text>
  <!-- A6: 위쪽 외벽, Q6 -->
  <line class="crit" x1="226" y1="60" x2="272" y2="60"/><line class="th" x1="226" y1="52" x2="226" y2="68"/><line class="th" x1="272" y1="52" x2="272" y2="68"/>
  <text class="tm" x="236" y="90">A<tspan dy="4" class="ts">6</tspan></text>
  <line class="ld" x1="249" y1="50" x2="249" y2="18" marker-end="url(#ar)"/>
  <text class="tm" x="258" y="30">Q<tspan dy="4" class="ts">6</tspan></text>
</svg>