<svg viewBox="0 0 280 330" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 펌프 -->
  <rect class="nd" x="103" y="128" width="15" height="30"/>
  <circle class="nd" cx="98" cy="188" r="30"/>
  <circle class="nd" cx="98" cy="188" r="8"/>
  <!-- 토출 배관 (위로) -->
  <path class="ln" d="M118,20 V128"/>
  <!-- B 압력계 -->
  <path class="ln" d="M118,81 H165 V65"/>
  <circle class="nd" cx="165" cy="53" r="12"/>
  <line class="ld" x1="157" y1="61" x2="176" y2="43" marker-end="url(#ar)"/>
  <text class="tb" x="158" y="32">B</text>
  <text class="tx" x="184" y="62">0.5 MPa</text>
  <!-- 흡입 배관 · 후드밸브 -->
  <path class="ln" d="M98,196 V300"/>
  <rect class="sup" x="72" y="300" width="33" height="16"/>
  <text class="tx" x="114" y="313">후드밸브</text>
  <!-- A 연성계 -->
  <path class="ln" d="M98,233 H167 V214"/>
  <circle class="nd" cx="167" cy="203" r="11"/>
  <line class="ld" x1="160" y1="210" x2="177" y2="194" marker-end="url(#ar)"/>
  <text class="tb" x="160" y="182">A</text>
  <text class="tx" x="184" y="210">3.8 mmHg</text>
  <!-- 높이차 5 m -->
  <path class="th" d="M50,86 H166 M50,233 H98"/>
  <line class="dm" x1="54" y1="86" x2="54" y2="233" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="18" y="165">5 m</text>
</svg>