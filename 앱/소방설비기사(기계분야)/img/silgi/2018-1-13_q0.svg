  <line class="m" x1="420" y1="300" x2="80" y2="300"/>
  <g>
    <line class="ln" x1="80" y1="190" x2="80" y2="204"/><polygon class="rb" points="71,204 89,204 80,220"/>
    <line class="ln" x1="170" y1="190" x2="170" y2="204"/><polygon class="rb" points="161,204 179,204 170,220"/>
