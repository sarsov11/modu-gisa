    <line class="ln" x1="80" y1="300" x2="80" y2="314"/><polygon class="rb" points="71,314 89,314 80,330"/>
    <line class="ln" x1="170" y1="300" x2="170" y2="314"/><polygon class="rb" points="161,314 179,314 170,330"/>
    <line class="ln" x1="260" y1="300" x2="260" y2="314"/><polygon class="rb" points="251,314 269,314 260,330"/>
