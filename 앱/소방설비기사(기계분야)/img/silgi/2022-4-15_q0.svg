<svg viewBox="0 0 540 350" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 관로망 -->
  <rect class="m" x="110" y="100" width="260" height="156"/>
  <!-- 유입·유출 -->
  <line class="ld" x1="40" y1="52" x2="104" y2="94" marker-end="url(#ar)"/>
  <text class="tx" x="16" y="40">0.6 m³/s</text>
  <line class="ld" x1="376" y1="94" x2="440" y2="52" marker-end="url(#ar)"/>
  <text class="tx" x="424" y="40">0.2 m³/s</text>
  <line class="ld" x1="376" y1="262" x2="440" y2="304" marker-end="url(#ar)"/>
  <text class="tx" x="424" y="326">0.4 m³/s</text>
  <!-- 점 -->
  <text class="tb" x="90" y="124">A</text><text class="tb" x="378" y="124">B</text><text class="tb" x="378" y="250">C</text><text class="tb" x="90" y="250">D</text>
  <!-- 관 이름 -->
  <text class="tm" x="236" y="90">d<tspan dy="4" class="ts">1</tspan></text>
  <text class="tm" x="382" y="184">d<tspan dy="4" class="ts">2</tspan></text>
  <text class="tm" x="236" y="282">d<tspan dy="4" class="ts">3</tspan></text>
  <text class="tm" x="88" y="184">d<tspan dy="4" class="ts">4</tspan></text>
  <!-- 유량 방향 Q1, Q2, Q3 -->
  <line class="ld" x1="196" y1="124" x2="262" y2="124" marker-end="url(#ar)"/>
  <text class="tm" x="270" y="129">Q<tspan dy="4" class="ts">1</tspan></text>
  <line class="ld" x1="338" y1="144" x2="338" y2="210" marker-end="url(#ar)"/>
  <text class="tm" x="312" y="182">Q<tspan dy="4" class="ts">2</tspan></text>
  <line class="ld" x1="196" y1="232" x2="262" y2="232" marker-end="url(#ar)"/>
  <text class="tm" x="270" y="237">Q<tspan dy="4" class="ts">3</tspan></text>
  <!-- 치수 -->
  <line class="th" x1="110" y1="262" x2="110" y2="310"/><line class="th" x1="370" y1="262" x2="370" y2="310"/>
  <line class="dm" x1="110" y1="300" x2="370" y2="300" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="224" y="324">250 m</text>
  <line class="dm" x1="440" y1="100" x2="440" y2="256" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="th" x1="378" y1="100" x2="446" y2="100"/><line class="th" x1="378" y1="256" x2="446" y2="256"/>
  <text class="tx" x="452" y="184">150 m</text>
</svg>