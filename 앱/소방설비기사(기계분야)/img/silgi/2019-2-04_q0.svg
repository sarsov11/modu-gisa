<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .cn{font-size:1.4em;font-family:'Noto Sans KR','Malgun Gothic',sans-serif} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 급수관 H점 -->
  <text class="tx" x="16" y="262">H점 가압수 0.15 MPa</text>
  <line class="ld" x1="16" y1="210" x2="44" y2="210" marker-end="url(#ar)"/>
  <!-- 기준선 -->
  <!-- E 너머 가지배관 끝부분: 500, 2000 -->
  <line class="m" x1="290" y1="180" x2="130" y2="180"/>
  <circle class="rb" cx="130" cy="180" r="4"/>
  <circle class="nd" cx="220" cy="180" r="5"/>
  <text class="ts" x="236" y="170">500</text>
  <text class="ts" x="150" y="170">2000</text>
  <!-- G 위 100 -->
  <line class="m" x1="170" y1="210" x2="170" y2="180"/>
  <circle class="rb" cx="170" cy="180" r="4"/>
  <text class="ts" x="176" y="196">100</text>
  <!-- 주배관 H - G - F -->
  <line class="m" x1="50" y1="210" x2="290" y2="210"/>
  <text class="ts" x="76" y="202">50A · 3000</text>
  <text class="ts" x="196" y="202">40A · 3000</text>
  <!-- F에서 E로 100 상승 -->
  <line class="m" x1="290" y1="210" x2="290" y2="180"/>
  <text class="ts" x="298" y="200">32A · 100</text>
  <!-- 가지배관 E - D - C - B - A -->
  <polyline class="m" points="290,180 570,180 570,205"/>
  <text class="ts" x="300" y="170">32A · 1500</text>
  <text class="ts" x="372" y="170">25A · 2000</text>
  <text class="ts" x="452" y="170">25A · 2000</text>
  <text class="ts" x="528" y="170">25A · 100</text>
  <text class="ts" x="578" y="198">25A · 300</text>
  <!-- A 헤드 -->
  <circle class="nd" cx="570" cy="212" r="7"/>
  <text class="tr" x="584" y="226">A</text>
  <!-- 점 -->
  <circle class="nd" cx="50" cy="210" r="5"/><circle class="nd" cx="170" cy="210" r="5"/><circle class="nd" cx="290" cy="210" r="5"/>
  <circle class="nd" cx="290" cy="180" r="5"/><circle class="nd" cx="360" cy="180" r="5"/><circle class="nd" cx="440" cy="180" r="5"/><circle class="nd" cx="520" cy="180" r="5"/>
  <text class="tb" x="44" y="236">H</text><text class="tb" x="164" y="236">G</text><text class="tb" x="284" y="236">F</text>
  <text class="tb" x="270" y="172">E</text><text class="tb" x="354" y="200">D</text><text class="tb" x="434" y="200">C</text><text class="tb" x="514" y="200">B</text>
  <text class="ts" x="16" y="284">※ 길이 mm · 비례 아님 · 헤드 A만 개방(다른 헤드는 닫힘), 헤드는 15A</text>
</svg>