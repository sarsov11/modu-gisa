  <path class="ln" d="M486,108 L505,128"/><path class="ln" d="M490,104 L509,124"/>
  <circle class="rb" cx="428" cy="181" r="3.5"/><circle class="rb" cx="328" cy="276" r="3.5"/>
  <text class="tb" x="440" y="206">E</text>
  <text class="tb" x="322" y="304">F</text>
  <!-- 330 L/min -->
  <line class="ld" x1="380" y1="296" x2="380" y2="232" marker-end="url(#ar)"/>
  <text class="tx" x="390" y="306">330 L/min</text>
</svg>