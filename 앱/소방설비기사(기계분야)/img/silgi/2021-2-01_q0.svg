  <line class="m" x1="428" y1="107" x2="428" y2="181"/>
  <!-- 아래쪽 가지배관 -->
  <path class="ln" d="M30,196 H22 V218 H30"/>
  <line class="m" x1="30" y1="207" x2="328" y2="207"/>
  <line class="ln" x1="55" y1="207" x2="55" y2="198"/><polygon class="nd" points="47,198 63,198 55,184"/>
  <line class="ln" x1="128" y1="207" x2="128" y2="198"/><polygon class="nd" points="120,198 136,198 128,184"/>
  <line class="ln" x1="200" y1="207" x2="200" y2="198"/><polygon class="nd" points="192,198 208,198 200,184"/>
  <line class="ln" x1="272" y1="207" x2="272" y2="198"/><polygon class="nd" points="264,198 280,198 272,184"/>
  <line class="m" x1="328" y1="207" x2="328" y2="276"/>
  <!-- 경사 배관 (왼쪽 아래에서 오른쪽 위로) -->
