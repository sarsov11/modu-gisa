<svg viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 루프 배관 : 10 px = 1 m -->
  <polyline class="m" points="70,240 70,40 370,40 370,240 70,240"/>
  <circle class="rb" cx="220" cy="240" r="5"/>
  <text class="tb" x="52" y="34">C</text><text class="tb" x="376" y="34">D</text><text class="tb" x="52" y="262">B</text><text class="tb" x="208" y="262">A</text><text class="tb" x="376" y="262">F</text><text class="tb" x="376" y="194">E</text>
  <!-- 살수헤드 E -->
  <polygon class="rb" points="372,178 372,202 346,190"/>
  <text class="tr" x="236" y="150">200 L/min</text>
  <line class="ld" x1="318" y1="146" x2="344" y2="180" marker-end="url(#ar)"/>
  <!-- 유량 Q1, Q2 -->
  <path class="ld" d="M206,226 Q150,224 108,190" marker-end="url(#ar)"/>
  <path class="ld" d="M234,226 Q290,224 332,190" marker-end="url(#ar)"/>
  <text class="tm" x="146" y="216">Q<tspan dy="4" class="ts">1</tspan></text>
  <text class="tm" x="270" y="216">Q<tspan dy="4" class="ts">2</tspan></text>
  <!-- 치수 -->
  <line class="th" x1="70" y1="246" x2="70" y2="290"/><line class="th" x1="220" y1="246" x2="220" y2="290"/><line class="th" x1="370" y1="246" x2="370" y2="290"/>
  <line class="dm" x1="70" y1="282" x2="220" y2="282" marker-start="url(#dmk)" marker-end="url(#dmk)"/><line class="dm" x1="220" y1="282" x2="370" y2="282" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="130" y="306">15 m</text><text class="tx" x="280" y="306">15 m</text>
  <line class="th" x1="376" y1="40" x2="430" y2="40"/><line class="th" x1="376" y1="190" x2="430" y2="190"/><line class="th" x1="376" y1="240" x2="430" y2="240"/>
  <line class="dm" x1="420" y1="40" x2="420" y2="190" marker-start="url(#dmk)" marker-end="url(#dmk)"/><line class="dm" x1="420" y1="190" x2="420" y2="240" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="428" y="120">15 m</text><text class="tx" x="428" y="220">5 m</text>
