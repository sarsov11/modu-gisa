  <line class="ld" x1="440" y1="67" x2="500" y2="67" marker-end="url(#ar)"/>
  <text class="tb" x="130" y="72">A</text><text class="tb" x="266" y="72">B</text><text class="tb" x="390" y="72">C</text>
</svg>