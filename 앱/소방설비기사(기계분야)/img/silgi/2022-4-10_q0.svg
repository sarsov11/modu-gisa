  <line class="ld" x1="300" y1="64" x2="300" y2="24" marker-end="url(#ar)"/>
  <text class="tm" x="310" y="40">Q<tspan dy="4" class="ts">6</tspan></text>
  <line class="ld" x1="464" y1="165" x2="510" y2="165" marker-end="url(#ar)"/>
