  <line class="th" x1="90" y1="42" x2="76" y2="66" marker-end="url(#ai)"/>
  <line class="crit" x1="164" y1="112" x2="164" y2="136"/>
  <text class="tx" x="176" y="96">문의 틈새면적</text>
  <line class="th" x1="174" y1="100" x2="166" y2="112" marker-end="url(#ai)"/>
  <line class="ld" x1="64" y1="124" x2="176" y2="124" marker-end="url(#ar)"/>
  <text class="tx" x="186" y="130">Q (누출 공기량)</text>
  <!-- 평면도 -->
  <rect class="fl" x="340" y="50" width="180" height="50"/>
  <rect class="fl" x="430" y="100" width="180" height="70"/>
  <path class="m" d="M340,50 H520 V100 H610 V170 H430 V100 H340 Z"/>
  <path class="ln" d="M430,50 V100 M430,100 H520 M520,100 V170"/>
  <text class="tb" x="372" y="82">A실</text>
  <!-- 문 -->
  <line class="crit" x1="430" y1="60" x2="430" y2="90"/><text class="tx" x="438" y="84"><tspan class="cn">①</tspan></text>
  <line class="crit" x1="450" y1="100" x2="500" y2="100"/><text class="tx" x="468" y="120"><tspan class="cn">②</tspan></text>
  <line class="crit" x1="430" y1="120" x2="430" y2="150"/><text class="tx" x="410" y="140"><tspan class="cn">③</tspan></text>
  <line class="crit" x1="450" y1="170" x2="500" y2="170"/><text class="tx" x="468" y="194"><tspan class="cn">④</tspan></text>
  <line class="crit" x1="520" y1="120" x2="520" y2="150"/><text class="tx" x="528" y="140"><tspan class="cn">⑤</tspan></text>
  <line class="crit" x1="610" y1="120" x2="610" y2="150"/><text class="tx" x="620" y="140"><tspan class="cn">⑥</tspan></text>
</svg>