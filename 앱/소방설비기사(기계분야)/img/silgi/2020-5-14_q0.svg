  <line class="th" x1="92" y1="40" x2="118" y2="40"/><line class="th" x1="92" y1="95" x2="118" y2="95"/>
  <line class="dm" x1="100" y1="40" x2="100" y2="95" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="8" y="72"><tspan class="tm">φ</tspan>100 mm</text>
  <!-- 지점 1, 2, φ50 -->
  <text class="tx" x="238" y="30" text-anchor="middle">1</text>
  <text class="tx" x="320" y="44" text-anchor="middle">2</text>
  <text class="tx" x="262" y="22"><tspan class="tm">φ</tspan>50 mm</text>
  <line class="th" x1="300" y1="26" x2="306" y2="52" marker-end="url(#ai)"/>
