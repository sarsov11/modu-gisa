<svg viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .cn{font-size:1.4em;font-family:'Noto Sans KR','Malgun Gothic',sans-serif} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 구역 -->
  <rect class="fl" x="120" y="80" width="360" height="180"/>
  <rect class="ln" x="120" y="80" width="120" height="180"/>
  <rect class="ln" x="240" y="80" width="120" height="180"/>
  <rect class="ln" x="360" y="80" width="120" height="180"/>
  <text class="tb" x="180" y="176" text-anchor="middle">A구역</text>
  <text class="tb" x="300" y="176" text-anchor="middle">B구역</text>
  <text class="tb" x="420" y="176" text-anchor="middle">C구역</text>
  <!-- 가로 치수 20 m x 3 -->
  <line class="th" x1="120" y1="74" x2="120" y2="48"/><line class="th" x1="240" y1="74" x2="240" y2="48"/><line class="th" x1="360" y1="74" x2="360" y2="48"/><line class="th" x1="480" y1="74" x2="480" y2="48"/>
  <line class="dm" x1="120" y1="56" x2="240" y2="56" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="240" y1="56" x2="360" y2="56" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <line class="dm" x1="360" y1="56" x2="480" y2="56" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="180" y="44" text-anchor="middle">20 m</text>
  <text class="tx" x="300" y="44" text-anchor="middle">20 m</text>
  <text class="tx" x="420" y="44" text-anchor="middle">20 m</text>
  <!-- 세로 치수 30 m -->
  <line class="th" x1="486" y1="80" x2="606" y2="80"/><line class="th" x1="486" y1="260" x2="606" y2="260"/>
  <line class="dm" x1="598" y1="80" x2="598" y2="260" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tx" x="560" y="176">30 m</text>
  <!-- 급기 Fan실: 오른쪽 위 바깥, 급기가 실 쪽으로 -->
  <rect class="sup" x="488" y="80" width="84" height="46"/>
  <text class="tb" x="530" y="98" text-anchor="middle">급 기</text>
  <line class="ld" x1="556" y1="112" x2="504" y2="112" marker-end="url(#ar)"/>
  <text class="ts" x="530" y="144" text-anchor="middle">Fan실</text>
  <!-- 배기 Fan실: 왼쪽 아래 바깥, 배기가 실 바깥쪽으로 -->
  <rect class="sup" x="30" y="214" width="84" height="46"/>
  <text class="tb" x="72" y="232" text-anchor="middle">배 기</text>
  <line class="ld" x1="98" y1="246" x2="46" y2="246" marker-end="url(#ar)"/>
  <text class="ts" x="72" y="278" text-anchor="middle">Fan실</text>
</svg>