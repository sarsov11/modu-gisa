  <text class="tb" x="160" y="256" text-anchor="end">E</text>
  <text class="tb" x="480" y="256">F</text>
  <!-- 유량 Q1, Q2 -->
  <path class="ld" d="M192,124 Q198,92 240,92" marker-end="url(#ar)"/>
