<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg"><style>
svg{background:#FFFFFF}
.m{stroke:#1F2533;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#1F2533;stroke-width:1.8;fill:none;stroke-linejoin:round}
.th{stroke:#5B6475;stroke-width:1.1;fill:none}
.dsh{stroke:#5B6475;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
.ld{stroke:#E0313A;stroke-width:1.8;fill:none}
.dm{stroke:#8C95A8;stroke-width:1.1;fill:none}
.crit{stroke:#E0313A;stroke-width:3.4;fill:none;stroke-linecap:round}
.nd{stroke:#1F2533;stroke-width:1.8;fill:#FFFFFF}
.rb{fill:#1F2533;stroke:none} .fl{fill:#EEF1F6;stroke:none} .hl{fill:#FDE7E8;stroke:none} .sup{fill:#EEF1F6;stroke:#1F2533;stroke-width:1.8}
.tx,.tb,.ts,.tr,.tm{font-family:Pretendard, 'Noto Sans KR', sans-serif;fill:#1F2533;font-size:15px}
.tb{font-weight:800} .cn{font-size:1.4em;font-family:'Noto Sans KR','Malgun Gothic',sans-serif} .ts{font-size:12.5px;fill:#5B6475} .tr{fill:#E0313A;font-weight:800} .tm{font-style:italic;font-family:'Times New Roman',serif;font-size:16px}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0313A"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2533"/></marker>
<marker id="dmk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#8C95A8" stroke-width="1.4"/></marker>
<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#9AA3B5" stroke-width="1.2"/></pattern>
</defs>
  <!-- 호스(A1) -->
  <line class="m" x1="40" y1="90" x2="296" y2="90"/>
  <line class="m" x1="40" y1="210" x2="296" y2="210"/>
  <!-- 플랜지 + 볼트 -->
  <rect class="sup" x="296" y="72" width="12" height="156"/>
  <rect class="sup" x="286" y="62" width="32" height="8"/>
  <rect class="sup" x="286" y="230" width="32" height="8"/>
  <line class="th" x1="302" y1="62" x2="302" y2="238"/>
  <!-- 노즐 -->
  <line class="m" x1="308" y1="90" x2="440" y2="132"/>
  <line class="m" x1="308" y1="210" x2="440" y2="168"/>
  <line class="m" x1="440" y1="132" x2="500" y2="132"/>
  <line class="m" x1="440" y1="168" x2="500" y2="168"/>
  <!-- 단면 A1 -->
  <line class="dm" x1="190" y1="90" x2="190" y2="210" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tm" x="202" y="146">A<tspan dy="4" class="ts">1</tspan></text>
  <text class="tx" x="202" y="168">내경 100 mm</text>
  <!-- 단면 A2 -->
  <line class="dm" x1="480" y1="132" x2="480" y2="168" marker-start="url(#dmk)" marker-end="url(#dmk)"/>
  <text class="tm" x="470" y="104">A<tspan dy="4" class="ts">2</tspan></text>
  <text class="tx" x="436" y="190">내경 30 mm</text>
  <!-- 힘 -->
  <line class="ld" x1="48" y1="150" x2="132" y2="150" marker-end="url(#ar)"/>
  <text class="tm" x="44" y="136">F<tspan dy="4" class="ts">1</tspan><tspan dy="-4"> = P</tspan><tspan dy="4" class="ts">1</tspan><tspan dy="-4">A</tspan><tspan dy="4" class="ts">1</tspan></text>
  <line class="ld" x1="410" y1="150" x2="340" y2="150" marker-end="url(#ar)"/>
  <text class="tm" x="356" y="140">F<tspan dy="4" class="ts">x</tspan></text>
  <line class="ld" x1="610" y1="150" x2="518" y2="150" marker-end="url(#ar)"/>
  <text class="tm" x="524" y="136">F<tspan dy="4" class="ts">2</tspan><tspan dy="-4"> = P</tspan><tspan dy="4" class="ts">2</tspan><tspan dy="-4">A</tspan><tspan dy="4" class="ts">2</tspan></text>
  <!-- 조건 -->
  <text class="tx" x="470" y="236">P<tspan dy="4" class="ts">2</tspan><tspan dy="-4"> = 0 (대기압)</tspan></text>
  <text class="tx" x="470" y="258">Z<tspan dy="4" class="ts">1</tspan><tspan dy="-4"> = Z</tspan><tspan dy="4" class="ts">2</tspan><tspan dy="-4"> (수평배관)</tspan></text>
</svg>