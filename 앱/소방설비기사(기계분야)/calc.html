<style>

.ct-lawd{margin-top:8px} .ct-lawd summary{cursor:pointer;font-size:13.5px;font-weight:800;color:var(--ink-2)}

.ct-res{border:1.5px solid var(--ink);border-radius:var(--r2);background:var(--surface);padding:12px 14px;margin:0 0 14px}

</style>

<div class="page">
  <div class="hd"><h1 id="ttl">계산기</h1></div>

<script>
(function(){
  GS.내비("silgi.html");
  var CF=window.CF||{계산기:[],유형:{}}, SG=window.SG||{문항:[]}, C=window.CALC, e=GS.esc, P=new URLSearchParams(location.search);
  function el(x){return document.getElementById(x);}
  var 계들=CF.계산기, 표={}; 계들.forEach(function(c){표[c.id]=c;});
  var 탭=P.get("tab")==="kp"?"kp":"type";
  document.querySelectorAll("#seg a").forEach(function(a){ if(a.dataset.tab===탭) a.classList.add("on"); });

  if(탭==="kp") return 공학용();

  /* ── 문항에서 왔으면 그 문항과 주어진 값 ── */
  var 문항=null, qid=P.get("q");
  if(qid) 문항=SG.문항.filter(function(x){return x.id===qid;})[0]||null;
  var cid=P.get("c"), 연결=null;
  if(문항 && 문항.cx && P.get("s")!=null){ 연결=문항.cx[Number(P.get("s"))]||null; if(연결&&표[연결.c]&&!cid) cid=연결.c; }
  if(!cid && 문항 && 문항.c && 표[문항.c]) cid=문항.c;
  var 유형=P.get("t")||(문항&&(문항.tp||문항.t))||"";   /* 소방 유형코드는 tp(앱생성이 옮김) */
  if(!cid && 유형) cid=고른계산기(유형, 문항&&문항.v);
  if(!cid || !표[cid]) return 목록();
  return 풀이(표[cid]);

  function 고른계산기(t, v){
    var 후보=계들.filter(function(c){return c.t===t;});
    if(!후보.length) return null;
    if(!v) return 후보[0].id;
    var 키=값목록(v).map(function(o){return o.k||o.이름;});
    후보.sort(function(a,b){return 맞는수(b,키)-맞는수(a,키);});
    return 후보[0].id;
  }
  function 맞는수(c,키){return 키.filter(function(k){return !!입력찾기(c,k);}).length;}
  function 값목록(v){
    if(!v) return [];
    if(Array.isArray(v)) return v.map(function(o){return {k:o.k, 이름:o.이름, 값:o.값!=null?o.값:o.v, 단위:o.단위||o.u||""};});
    return Object.keys(v).map(function(k){var x=v[k];
      if(Array.isArray(x)) return {k:k,값:x[0],단위:x[1]||""};
      if(x&&typeof x==="object") return {k:k,값:x.값!=null?x.값:x.v,단위:x.단위||x.u||""};
      return {k:k,값:x,단위:""};});
  }
  function 입력찾기(c,k){
    if(!k) return null;
    return c.입력.filter(function(i){return i.k===k;})[0]||c.입력.filter(function(i){return i.이름===k;})[0]||
      c.입력.filter(function(i){return k.length>=2&&(i.이름.indexOf(k)>=0||k.indexOf(i.이름)>=0);})[0]||null;
  }

  /* ── 유형 목록 ── */
  function 목록(){
    el("ttl").textContent="계산기";
    var 쓰인={}; SG.문항.forEach(function(x){ var u=x.tp||x.t; if(u) 쓰인[u]=(쓰인[u]||0)+1; });
    var ts=[]; 계들.forEach(function(c){ if(ts.indexOf(c.t)<0) ts.push(c.t); });
    var 유=CF.유형||{};
    el("stage").innerHTML=(계들.length?'':'<div class="none">이 종목은 계산기를 준비하고 있습니다.</div>')+
      '<div class="ct-types">'+ts.map(function(t){
        var u=유[t]||{};
        var n=쓰인[t]||u.n||0;
        return '<div class="ct-type"><h3><b>'+e(t)+'</b>'+e(u.이름||t)+(n?'<small>기출 '+n+'문항</small>':'')+'</h3><div class="ls">'+
          계들.filter(function(c){return c.t===t;}).map(function(c){return '<a href="calc.html?c='+c.id+'">'+e(c.이름)+'</a>';}).join("")+'</div></div>';
      }).join("")+'</div>';
  }

  /* ── 풀이 화면 (1018 대표님: 풀 때는 빈칸에 직접 넣기, 결과는 맨 위에 「이 문제에서 정해지는 값」 표) ──
     화면 글은 문제 원문·정답지 표기·NFTC 원문만 쓴다. 계산기 식(min·pick…)과 입력 기호는 화면에 내지 않는다. */
  function 풀이(계){
    el("ttl").textContent=계.이름;
    var 같은=계들.filter(function(c){return c.t===계.t;});
    var 단계표={}; 계.단계.forEach(function(d){단계표[d.k]=d;});
    var 입력표={}; 계.입력.forEach(function(i){입력표[i.k]=i;});
    var h='';
    if(문항){
      h+='<details class="ct-q" open><summary>문제 · '+e(문항.y+"년 "+문항.r+"회 "+문항.n+"번")+'</summary><p>'+e(문항.q)+'</p>'+
        (문항.img||[]).map(function(f){return '<img loading="lazy" alt="" src="img/silgi/'+e(f)+'">';}).join("")+'</details>';
      var 줄=소문제줄(문항.q, 연결&&연결.no);
      if(줄.length) h+='<div class="ct-ask">'+줄.map(function(s){return '<div>'+e(s)+'</div>';}).join("")+'</div>';
    }
    if(같은.length>1) h+='<div class="ct-other">'+같은.map(function(c){
      var q=new URLSearchParams(location.search); q.set("c",c.id); q.delete("t");
      return '<a class="'+(c.id===계.id?"on":"")+'" href="?'+q.toString()+'">'+e(c.이름)+'</a>';}).join("")+'</div>';

        (단.length>1?'<select class="u" id="u_'+i.k+'">'+단.map(function(u){return '<option value="'+e(u)+'"'+(u===i.단위?' selected':'')+'>'+e(C.단위글(u))+'</option>';}).join("")+'</select>':

  }
  function 읽기(계){

  function 채우기(계, v){

  function 단위정리(u){ return String(u).replace(/㎥|m³/g,"m3").replace(/㎡|m²/g,"m2").replace(/㎫/g,"MPa").replace(/㎪/g,"kPa").replace(/ℓ/g,"L").replace(/㎜/g,"mm").replace(/\s/g,"").replace(/^l\//,"L/").replace(/^°C$/,"℃"); }

  function 공학용(){

    var ex=el("ex"), ans=0, 끝=false;
    function 넣(s){ if(끝&&/^[0-9.(√πE]/.test(s)){ ex.value=""; } 끝=false; var p=ex.selectionStart!=null&&document.activeElement===ex?ex.selectionStart:ex.value.length; ex.value=ex.value.slice(0,p)+s+ex.value.slice(p); 미리(); }
    /* 화면 기호 → 식 문법. 2π·3√(…)·2(…) 처럼 곱셈 기호를 빼먹어도 곱으로 읽는다 */
    function 정리(s){ return s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/π/g,"pi").replace(/√/g,"sqrt").replace(/Ans/g,"ans")
      .replace(/(\d)E(-?\d+(?:\.\d+)?)/g,"$1*10^($2)")
      .replace(/(\d|\))\s*(?=(?![eE][-+]?\d)[A-Za-z(])/g,"$1*").replace(/(pi|ans)\s*(?=[A-Za-z0-9(])/g,"$1*"); }
    function 값(){ var s=정리(ex.value); var o=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length; while(o-->0) s+=")"; return C.식값(s,{ans:ans}); }
    function 미리(){ try{ var v=값(); el("out").textContent=isFinite(v)?C.수(v,8):"—"; }catch(_){ el("out").textContent="…"; } }
    function 계산(){ try{ var v=값(); if(!isFinite(v)) throw 0; el("hist").insertAdjacentHTML("afterbegin",'<div data-v="'+v+'"><span>'+e(ex.value)+'</span><b>'+e(C.수(v,8))+'</b></div>'); ans=v; el("out").textContent=C.수(v,8); 끝=true; }catch(_){ el("out").textContent="식 확인"; } }
    document.querySelector(".ct-keys").onclick=function(ev){
      var b=ev.target.closest("button"); if(!b) return; var k=b.dataset.k;
      if(k==="=") return 계산();
      if(k==="AC"){ ex.value=""; el("out").textContent="0"; return; }
      if(k==="⌫"){ ex.value=ex.value.slice(0,-1); 미리(); return; }
      if(k==="√") return 넣("√(");
      if(k==="x²") return 넣("^2");
      if(k==="log") return 넣("log(");
      if(k==="ln") return 넣("ln(");
      if(k==="10ˣ") return 넣("10^");
      if(k==="±"){ ex.value=ex.value?"−("+ex.value+")":"−"; 미리(); return; }
      if(k==="Ans"){ if(끝){ex.value="";끝=false;} return 넣("Ans"); }
      if(끝&&/[+−×÷^]/.test(k)){ ex.value="Ans"; 끝=false; }
      넣(k);
    };
    ex.addEventListener("input",미리);
    ex.addEventListener("keydown",function(ev){ if(ev.key==="Enter"){ev.preventDefault();계산();} if(ev.key==="Escape"){ex.value="";미리();} });
    el("hist").onclick=function(ev){ var d=ev.target.closest("div[data-v]"); if(d){ 넣(C.수(Number(d.dataset.v),10)); } };
    /* 단위 바꾸기 */
    var 이름={"유량":"유량","부피":"부피","압력":"압력·수두","길이":"길이","질량":"질량","시간":"시간","동력":"동력","넓이":"넓이","질량유량":"질량유량"};
    var 전부=[]; Object.keys(C.단위표).forEach(function(d){ Object.keys(C.단위표[d]).forEach(function(u){ 전부.push([d,u]); }); }); 전부.push(["온도","℃"],["온도","K"]);
    var a=el("cva"), b=el("cvb");
    a.innerHTML=Object.keys(이름).concat(["온도"]).map(function(d){ return '<optgroup label="'+(이름[d]||d)+'">'+전부.filter(function(x){return x[0]===d;}).map(function(x){return '<option value="'+e(x[1])+'">'+e(C.단위글(x[1]))+'</option>';}).join("")+'</optgroup>'; }).join("");
    function b채움(){ var 같=C.같은차원(a.value); var 전=b.value; b.innerHTML=같.map(function(u){return '<option value="'+e(u)+'">'+e(C.단위글(u))+'</option>';}).join(""); if(같.indexOf(전)>=0&&전!==a.value) b.value=전; else b.value=같.filter(function(u){return u!==a.value;})[0]||a.value; }
    function 바꿈(){ var x=Number(String(el("cvx").value).replace(/,/g,"")); var r=C.변환(x,a.value,b.value); el("cvo").textContent=r==null||isNaN(r)?"—":C.수(r,8); }
    a.onchange=function(){ b채움(); 바꿈(); }; b.onchange=바꿈; el("cvx").oninput=바꿈;
    var 빠른=[["L/min","m3/s"],["L/min","m3/min"],["kPa","mAq"],["MPa","mAq"],["mmHg","mmAq"],["℃","K"],["m3/h","m3/min"],["L","m3"]];
    el("cvq").innerHTML=빠른.map(function(p){return '<button data-a="'+e(p[0])+'" data-b="'+e(p[1])+'">'+e(C.단위글(p[0]))+' → '+e(C.단위글(p[1]))+'</button>';}).join("");
    el("cvq").onclick=function(ev){ var t=ev.target.closest("button"); if(!t) return; a.value=t.dataset.a; b채움(); b.value=t.dataset.b; 바꿈(); };
    a.value="L/min"; b채움(); b.value="m3/s"; 바꿈();
  }
