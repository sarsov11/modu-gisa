  function 판정(x, 답){

    if(x.t==="sql") return SGX.SQL채점(답[0],x).then(function(r){
      return {v:r.ok?2:0, 상세:(r.오류?'<div class="x-err">'+e(r.오류)+'</div>':SGX.표HTML(r.표학생,"내 결과"))+SGX.표HTML(r.표정답,"정답 결과")+'<div class="x-h"><b>정답 SQL</b><pre class="x-out" style="white-space:pre-wrap;margin:6px 0 0">'+e(x.sql||x.a)+'</pre></div>'};
    });
    if(칸){
      var r=SGX.칸들채점(답, 칸, x.순서무관), ok=r.every(Boolean);
      return Promise.resolve({v:ok?2:0, 칸결과:r, 상세:'<table class="x-cmp"><thead><tr><th>칸</th><th>내 답</th><th>정답</th></tr></thead><tbody>'+
        칸.map(function(k,j){return '<tr class="'+(r[j]?"":"bad")+'"><td>'+(j+1)+'</td><td>'+e(답[j]||"(없음)")+'</td><td>'+e(k.a)+'</td></tr>';}).join("")+'</tbody></table>'});
    }
    if(x.t==="code"){
      var ok=x.순서무관?SGX.낱말같음(답[0],x.a):SGX.출력채점(답[0],x.a);
      var 비=SGX.출력비교(답[0],x.a);
      return Promise.resolve({v:ok?2:0, 상세:'<table class="x-cmp"><thead><tr><th>줄</th><th>내 답</th><th>정답</th></tr></thead><tbody>'+
        비.map(function(z,j){return '<tr class="'+(z.같||ok?"":"bad")+'"><td>'+(j+1)+'</td><td>'+e(z.내||"(없음)")+'</td><td>'+e(z.답)+'</td></tr>';}).join("")+'</tbody></table>'});
    }
    var ok1=SGX.칸채점(답[0], {a:x.a, syn:x.syn||[]});
    return Promise.resolve({v:ok1?2:0, 상세:'<div style="font-weight:800;font-size:16px;white-space:pre-wrap">'+e(x.a)+'</div>'+((x.syn||[]).length?'<p class="x-rule">같이 받는 답: '+e(x.syn.join(", "))+'</p>':'')});
  }
  function 기록하기(x, v){
    var r=S.실기[x.id]||{n:0}; r.n++; r.v=v; r.t=GS.오늘(); S.실기[x.id]=r; GS.저장();
  }
  function 채점(x){
    var 답=입력값(x);
    if(모의세트){ 답모음[i]=답; 결과[i]=-1; i++; return 그리기(); }   /* 모의는 끝나고 한 번에 */
    판정(x, 답).then(function(r){
      if(r.칸결과) r.칸결과.forEach(function(ok,k){ var n=el("in"+k); if(n) n.classList.add(ok?"ok":"no"); });
      if(window.ZZ){ if(r.v===2) ZZ.ok(el("go")); else ZZ.no(el("go")); }
      el("res").innerHTML='<div class="x-res '+(r.v===2?"ok":"no")+'"><h3>'+(r.v===2?"정답":"오답")+'</h3>'+r.상세+(x.h?'<div class="x-h">'+e(x.h)+'</div>':'')+
        (r.v<2?'<button class="x-fix" id="fix">채점이 틀렸다면 맞힌 걸로 치기</button>':'')+'</div>'+
        (x.trace&&x.trace.length?'<button class="b" id="tr" style="margin-bottom:10px">한 줄씩 따라가기</button>':'')+
        '<button class="b main" id="nx">다음 문항</button>';
      el("go").style.display="none";
      var v=r.v;
      if(el("fix")) el("fix").onclick=function(){ v=2; this.textContent="맞힌 걸로 기록했습니다"; this.disabled=true; };
      if(el("tr")) el("tr").onclick=function(){ el("tr").style.display="none"; SGX.재생기(el("cb"),x); el("cb").scrollIntoView({behavior:"smooth",block:"start"}); };
      el("nx").onclick=function(){ 기록하기(x,v); 결과[i]=v; i++; 그리기(); };
      el("res").scrollIntoView({behavior:"smooth",block:"start"});
    });
  }
  function 펼치기(){
    var x=문제[i];
    el("ans").innerHTML='<div class="sg-ans"><h3>정답</h3><div class="a">'+e(x.a)+'</div>'+
      (x.h?'<div class="h">'+e(x.h)+'</div>':'')+(x.ai?'<img class="sg-fig" loading="lazy" alt="" src="img/silgi/'+e(x.ai)+'">':'')+'</div>'+
      (모의세트?'<button class="b main" id="nx">다음</button>':'<div class="sg-self" id="self"><button data-v="2">맞힘</button><button data-v="1">헷갈림</button><button data-v="0">틀림</button></div>');
    el("go").style.display="none";
    if(모의세트){ el("nx").onclick=function(){ 답모음[i]=[el("memo").value]; 결과[i]=-1; i++; 그리기(); }; }
    document.querySelectorAll("#self button").forEach(function(b){
      b.onclick=function(){
        var v=Number(b.dataset.v);
        if(window.ZZ){ if(v===2) ZZ.ok(b); else if(v===0) ZZ.no(b); }
        기록하기(x,v); 결과[i]=v; i++; 그리기();
      };
    });
    el("ans").scrollIntoView({behavior:"smooth",block:"start"});
  }
  /* 실전 모의: 시간 */
  if(모의세트){
    var 끝시각=Date.now()+(모의세트.분||150)*60000;
    var 시계=setInterval(function(){
      var 남=Math.max(0,끝시각-Date.now()), m=Math.floor(남/60000), s=Math.floor(남%60000/1000);
      el("tm").innerHTML='<div class="x-timer">남은 시간 '+m+':'+(s<10?"0":"")+s+'</div>';
      if(!남){ clearInterval(시계); while(i<문제.length){ 답모음[i]=답모음[i]||[""]; 결과[i]=-1; i++; } 끝(); }
    },1000);
  }
  function 끝(){
    el("prog").innerHTML=""; el("tm").innerHTML="";
    if(모의세트) return 모의끝();
    var 맞=결과.filter(function(v){return v===2;}).length, 헷=결과.filter(function(v){return v===1;}).length;
    var 점="", 합=0, 만=0;
    if(회){
      문제.forEach(function(x,j){ var p=x.pt||5; 만+=p; if(결과[j]===2) 합+=p; else if(결과[j]===1) 합+=Math.floor(p/2); });
      점='<div><b>'+합+' / '+만+'</b><span>'+(합>=만*0.6?"합격선 넘음":"합격선 "+Math.ceil(만*0.6))+'</span></div>';
    }
    if(window.ZZ&&결과.length>0){ var _p=맞/결과.length; ZZ.stars(_p>=1?3:_p>=.7?2:_p>=.4?1:0); }
    결과화면(맞, 헷, 점);
  }
  function 결과화면(맞, 헷, 점){
    var 틀=문제.filter(function(_,j){return 결과[j]<2;});
    var 목록=(틀.length?'<ul class="wl">'+틀.map(function(x){return '<li><b>'+e(x.q.length>70?x.q.slice(0,70)+"…":x.q)+'</b><span>'+e(x.a.length>60?x.a.slice(0,60)+"…":x.a)+'</span></li>';}).join("")+'</ul>':'');
    el("stage").innerHTML='<div class="done"><h2>'+e(el("ttl").textContent)+'</h2>'+
      '<div class="tally">'+(점||'<div><b>'+맞+' / '+결과.length+'</b><span>맞힘</span></div>')+
      '<div><b>'+헷+'</b><span>헷갈림</span></div><div><b>'+(결과.length-맞-헷)+'</b><span>틀림</span></div></div>'+
      '<div class="act">'+(틀.length?'<a class="b main" href="silgi.html?wrong=1">다시 볼 문항</a>':'')+
      '<div class="b2"><a class="b" href="'+e(location.pathname.split("/").pop()+location.search)+'">한 번 더</a><a class="b" href="silgi.html">목록</a></div></div>'+목록+'</div>';
  }
  function 모의끝(){
    /* 자동 채점 문항은 기계로, 나머지(free)는 틀림으로 두고 결과 화면에서 정답을 보여 준다 */
    var 일=문제.map(function(x,j){ return 자동(x)?판정(x, 답모음[j]||[""]).then(function(r){return r.v;}):Promise.resolve(0); });
    Promise.all(일).then(function(vs){
      결과=vs; vs.forEach(function(v,j){ 기록하기(문제[j], v); });
      var 맞=vs.filter(function(v){return v===2;}).length, 만=문제.length*5, 합=맞*5;
      if(window.ZZ){ var _p=맞/vs.length; ZZ.stars(_p>=.8?3:_p>=.6?2:_p>=.4?1:0); }
      결과화면(맞, 0, '<div><b>'+합+' / '+만+'</b><span>'+(합>=만*0.6?"합격선 넘음":"합격선 "+Math.ceil(만*0.6))+'</span></div>');
    });
  }
  그리기();
})();
</script>
