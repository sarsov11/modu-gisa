<style>
  /* 개념트리(1002) — 통사 스킬트리 문법: 위는 과목 지도(가운데 종목 → 과목), 아래는 과목 › 중분류 › 테마 가지 */

</style>

<script>
(function(){

    var r=표.filter(function(x){return x.s===과;})[0];

  function 행(r){ return '<div class="pl"><i class="rl '+(r[0]==="전략"?"st":"df")+'">'+r[0]+'</i><em>'+e(r[1])+'</em><b>'+r[2]+'%</b>'+위험(r[1])+'</div>'; }
  if(기준){

    var st=역.filter(function(r){return r[0]==="전략";})[0], df=역.filter(function(r){return r[0]==="방어";})[0];

  /* ── 과목 지도 ── 라벨 실제 상자를 재서 서로 밀어내고(unstack), 폭에 맞춰 다시 그린다(fitView).
     원·라벨은 겹치지 않고, 이름은 줄바꿈으로 전부 보인다. 과목 1~6개 모두 같은 규칙. */
  var mapEl=document.getElementById("map");

        var A=목록[a],B=목록[b],X=박스(A),Y=박스(B);
        var ox=Math.min(X.r,Y.r)-Math.max(X.l,Y.l)+간극, oy=Math.min(X.b,Y.b)-Math.max(X.t,Y.t)+간극;
        if(ox<=0||oy<=0) continue;

    var dy=12-위끝, H=Math.ceil(아래끝-위끝+24);
    목록.forEach(function(o){ o.y+=dy; });

  var 중=(D.중분류||{});

  function 정렬(ts){ return ts.slice().sort(function(a,b){return (GS.순[a.g]-GS.순[b.g])||(b.c-a.c);}); }
  var h="";
  차례.forEach(function(s,idx){
    var ts=과목[s], m=숙(ts), 있는={}; ts.forEach(function(t){있는[t.k]=t;});

             ((x.x||[]).length?'<div class="ss">'+x.x.map(function(y){return '<i>'+e(y)+'</i>';}).join("")+'</div>':'')+
             '<div class="lv">'+정렬(x.ts).map(잎).join("")+'</div>';

      });

    }

      .filter(function(g){return g.ts.length;});

})();
