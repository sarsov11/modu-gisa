<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기출로 확인 — 모두의 응용지질기사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/g.css">
<link rel="stylesheet" href="css/cheer.css">
<script>try{var _s=localStorage.getItem("modugisa2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  /* 통사 ox.html 「기출로 확인」 판 (2026-09-12·21 규격) */
  .hd h1{font-size:26px;letter-spacing:-.03em;margin:26px 0 0;font-weight:900}
  .prog{display:flex;gap:5px;margin:22px 0 16px}
  .prog i{flex:1;height:4px;border-radius:99px;background:var(--surface-3)}
  .prog i.ok{background:var(--ink-3)} .prog i.no{background:var(--accent)} .prog i.now{background:var(--ink-4)}

  .qwrap{border:1px solid var(--line-2);border-radius:var(--r2);background:var(--bg-2);
    padding:22px 20px;margin-bottom:18px}
  .qtag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14.5px;
    color:var(--ink-3);margin-bottom:16px}
  .qtag b{color:var(--accent);font-weight:800}
  .qtag .src{margin-left:auto;font-variant-numeric:tabular-nums}
  .qstem{font-size:16.5px;line-height:1.62;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
  .qpick{border:1px solid var(--accent);border-radius:var(--r3);padding:14px 16px;
    background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .qpick .tx{font-size:17px;line-height:1.62;font-weight:700;letter-spacing:-.01em}

  /* 확신 — 고르지 않아도 O·X 가 바로 눌린다(안 고르면 확실 아님으로 기록) */
  .conf{display:flex;gap:8px;align-items:center;margin:0 0 12px}
  .conf span{font-size:13.5px;color:var(--ink-3);font-weight:700;margin-right:2px}
  .conf button{appearance:none;border:1.5px solid var(--line-2);background:var(--surface-2);
    color:var(--ink-2);border-radius:99px;padding:7px 13px;font:inherit;font-size:14.5px;
    font-weight:700;cursor:pointer}
  .conf button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);color:var(--ink)}
  .ox{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .ox button{appearance:none;border:2px solid var(--line-2);background:var(--surface-2);color:var(--ink);
    border-radius:var(--r2);padding:20px;font:inherit;font-size:30px;font-weight:800;cursor:pointer;line-height:1}
  .ox button:disabled{opacity:.35;cursor:default}
  .ox button.pick{border-color:var(--ink);background:var(--surface);opacity:1}
  .ox button[data-s="ok"]{border-color:var(--cheer-ok);opacity:1}
  .ox button[data-s="no"]{border-color:var(--accent);opacity:1}

  .verdict{border-radius:var(--r2);padding:18px;margin-top:18px;border:1.5px solid var(--line-2);background:var(--surface-2)}
  .verdict.good{border-color:var(--ink-3);background:var(--surface)}
  .verdict.bad{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .verdict.warn{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent)}
  .verdict .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .verdict .mark{font-size:21px;font-weight:900;line-height:1}
  .verdict.bad .mark{color:var(--accent)} .verdict.warn .mark{color:var(--amber)}
  .verdict .kind{font-size:13.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:99px;
    padding:2px 9px;font-weight:800}
  /* 원래 기출 — 정답이 어느 것이었는지 같이 보여 준다(해설이 없는 자리를 기출이 채운다) */
  .orig{margin-top:4px;padding-top:10px;border-top:1px solid var(--line-2);font-size:15px;line-height:1.7}
  .orig p{margin:10px 0 6px;font-weight:600}
  .orig ol{margin:0;padding-left:22px}
  .orig li.ans{font-weight:800}
  .orig li.ans::after{content:"  ← 기출 정답";color:var(--accent);font-weight:800;font-size:13.5px}
  .orig li.mine{text-decoration:underline;text-decoration-color:var(--line-3)}
  .next{margin-top:14px}

  .done{text-align:center;padding:30px 4px}
  .done h2{font-size:24px;margin:0 0 18px;letter-spacing:-.03em}
  .tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}
  .tally div{border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface);padding:13px 6px}
  .tally b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .tally span{font-size:14px;color:var(--ink-3)}
  .done .b2{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
  @media(max-width:520px){ .qpick .tx{font-size:16px} .ox button{font-size:26px;padding:16px} }
</style>
</head><body>
<div class="page">
  <div class="hd"><h1 id="ttl">기출로 확인</h1></div>
  <div class="prog" id="prog"></div>
  <div id="stage"></div>
</div>
<script src="js/gdata.js"></script>
<script src="js/judge.js"></script>
<script src="js/gstore.js"></script>
<script src="js/cheer.js"></script>
<script>
(function(){
  GS.내비("");
  var D=GS.D, e=GS.esc, 깨=GS.깨끗, P=new URLSearchParams(location.search);
  var k=P.get("k"), 복습=P.get("review")==="1";
  var 문장들 = 복습 ? GS.다시볼것().slice(0,12) : GS.세션(k,12);
  var 테마 = k ? GS.테마맵[k] : null;
  if(테마) document.getElementById("ttl").textContent = 테마.n;
  else if(복습) document.getElementById("ttl").textContent = "복습";

  var i=0, 결과=[], 확신=null, 시작=0;
  function el(x){return document.getElementById(x);}

  /* 막다른 곳 없음 — 비어 있으면 루틴 다음 항목으로 */
  if(!문장들.length){
    if(복습) GS.루틴완료("review");
    var 비 =GS.루틴(), 큰=비.다음
      ? '<a class="b main" href="'+e(비.다음.주소)+'">'+e(GS.큰단추(비))+'</a>'
      : '<a class="b main" href="index.html">홈</a>';
    el("stage").innerHTML='<div class="done"><h2>'+(복습?"복습 0":"문장 없음")+'</h2>'+큰+
      '<div class="b2"><a class="b sm" href="tree.html">다른 테마</a></div></div>';
    return;
  }

  function 진행(){
    el("prog").innerHTML=문장들.map(function(_,j){
      var r=결과[j]; return '<i class="'+(r?(r.ok?"ok":"no"):(j===i?"now":""))+'"></i>';
    }).join("");
  }

  function 그리기(){
    진행();
    if(i>=문장들.length) return 끝();
    var o=문장들[i], q=D.qs[o.q]||{}, t=GS.테마맵[o.k]||{};
    확신=null; 시작=Date.now();
    el("stage").innerHTML=
      '<div class="qwrap">'+
        '<div class="qtag"><b>'+e(t.n||"")+'</b><span>'+(i+1)+' / '+문장들.length+'</span>'+
          '<span class="src">'+e(q.y||"")+(q.no?" "+q.no+"번":"")+'</span></div>'+
        '<p class="qstem">'+e(깨(o.s))+'</p>'+
        '<div class="qpick"><span class="tx">'+e(깨(o.c))+'</span></div>'+
      '</div>'+
      '<div class="conf"><span>확신</span><button data-c="sure">● 확실</button><button data-c="half">◐ 헷갈림</button>'+
        '<button data-c="guess">찍음</button></div>'+
      '<div class="ox"><button class="o" data-v="1">O</button><button class="x" data-v="0">X</button></div>'+
      '<div id="vd"></div>';
    document.querySelectorAll(".conf button").forEach(function(b){
      b.onclick=function(){
        var 켜짐=b.getAttribute("aria-pressed")==="true";
        확신=켜짐?null:b.dataset.c;
        document.querySelectorAll(".conf button").forEach(function(x){x.setAttribute("aria-pressed",(!켜짐&&x===b)?"true":"false");});
      };
    });
    document.querySelectorAll(".ox button").forEach(function(b){
      b.onclick=function(){ 답하기(Number(b.dataset.v),b); };
    });
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function 답하기(v,btn){
    var o=문장들[i], q=D.qs[o.q]||{}, t=GS.테마맵[o.k]||{};
    var ok=(v===o.a), ms=Date.now()-시작;
    document.querySelectorAll(".ox button,.conf button").forEach(function(x){x.disabled=true;});
    btn.classList.add("pick");
    btn.setAttribute("data-s",ok?"ok":"no");
    if(window.CHEER){ if(ok) CHEER.ok(btn); else CHEER.miss(btn); }
    var 전=GS.S.ox[o.i];
    var 판=JUDGE.판정({ok:ok,conf:확신,ms:ms,attempt:전?전.n+1:1,qid:o.i,
      mastery:GS.숙련(o.k),streak:GS.연속오답(o.k),leafName:t.n});
    GS.기록(o.i,ok,확신,ms);
    결과[i]={ok:ok,kind:판.kind};
    진행();
    var 선지=(q.c||[]).map(function(c,j){
      var cls=(j+1===q.a?"ans":"")+(j+1===o.n?" mine":"");
      return '<li class="'+cls+'">'+e(깨(c))+'</li>';
    }).join("");
    var 다음=(i+1>=문장들.length)?"결과":"다음";
    el("vd").innerHTML=
      '<div class="verdict '+판.tone+'">'+
        '<div class="top"><span class="mark">'+(ok?"○ 정답":"✕ 오답")+'</span>'+
          '<span class="kind">'+e(판.label||판.kind)+'</span></div>'+
        '<div class="ansline" style="font-size:13px;color:var(--ink-3);margin:2px 0 6px">정답 '+(o.a?"O":"X")+(o.d?' · 기출 '+o.d+'회':'')+'</div>'+
        /* 1005 근거: 같은 테마에서 O 로 판정된 비슷한 문장(지어낸 글 없음, 짝 없으면 생략) */
        (o.e&&GS.oxMap[o.e]?'<div class="why" style="font-size:14.5px;line-height:1.55;margin:0 0 8px;font-weight:700"><span style="color:var(--accent);font-weight:900">O ▸</span> '+e(깨(GS.oxMap[o.e].c))+'</div>':'')+
        /* 0925: 판정 아래엔 설명문 없이 기출 원문과 정답만 둔다 */
        '<div class="orig"><p>'+e(깨(q.q))+'</p><ol>'+선지+'</ol></div>'+
      '</div>'+
      '<div class="next"><button class="b main" id="nx">'+다음+'</button></div>';
    el("nx").onclick=function(){ i++; 그리기(); };
    el("vd").scrollIntoView({behavior:"smooth",block:"start"});
  }

  function 끝(){
    var 맞=결과.filter(function(r){return r.ok;}).length;
    var 오개념=결과.filter(function(r){return r.kind==="오개념";}).length;
    var m=k?GS.숙련(k):null;
    GS.루틴완료(복습?"review":"ox",k);
    var R=GS.루틴(), 다음=R.다음;
    el("prog").innerHTML="";
    var 큰 = 다음
      ? '<a class="b main" href="'+e(다음.주소)+'">'+e(GS.큰단추(R))+'</a>'
      : '<a class="b main" href="index.html">오늘 목표 완료</a>';
    var 작=[];
    if(R.완료) 작.push('<button class="b sm" id="more">한 세트 더</button>');
    if(k) 작.push('<a class="b sm" href="ox.html?k='+encodeURIComponent(k)+'">다시</a>');
    if(k&&!(다음&&다음.종류==="card")) 작.push('<a class="b sm" href="card.html?k='+encodeURIComponent(k)+'">개념</a>');
    if(R.완료&&GS.있다("exam.html")) 작.push('<a class="b sm" href="exam.html">모의고사</a>');
    작.push('<a class="b sm" href="index.html">홈</a>');
    el("stage").innerHTML=
      '<div class="done"><h2>'+(k&&테마?e(테마.n):"복습")+' — 끝</h2>'+
        '<div class="tally"><div><b>'+맞+'/'+결과.length+'</b><span>맞힘</span></div>'+
          '<div><b>'+오개념+'</b><span>오개념</span></div>'+
          '<div><b>'+(m==null?"—":Math.round(m*100)+"%")+'</b><span>이 테마</span></div></div>'+
        큰+'<div class="b2" style="margin-top:12px">'+작.join("")+'</div>'+
      '</div>';
    var more=el("more");
    if(more) more.onclick=function(){ GS.더하기(); location.href=GS.루틴().다음.주소; };
    window.scrollTo({top:0,behavior:"smooth"});
  }
  그리기();
})();
</script>
</body></html>
