<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시작 — 모두의 생산자동화기능사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/base.css?v=1111h">
<link rel="stylesheet" href="css/g.css?v=1111h">
<link rel="stylesheet" href="css/cheer.css?v=1111h">
<script>try{var _s=localStorage.getItem("modugisa2.skin")||"white";document.documentElement.dataset.skin=_s;}catch(e){document.documentElement.dataset.skin="white";}</script>
<style>
  .hd{padding:24px 2px 0}
  .hd small{display:block;font-size:14px;color:var(--ink-3);font-weight:700}
  .hd h1{font-size:26px;letter-spacing:-.04em;margin:6px 0 0;font-weight:800}
  .prog{display:flex;gap:0;margin:20px 0 18px;height:4px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .prog i{flex:1;height:4px;background:transparent}
  .prog i.on,.prog i.ok,.prog i.no{background:var(--pt)}
  .dr{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
  .gap{height:18px}
  .qwrap{border:0;border-radius:18px;background:var(--surface);box-shadow:0 1px 2px rgba(17,20,25,.05),0 0 0 1px var(--line);padding:18px;margin-bottom:16px}
  .qtag{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-3);margin-bottom:14px}
  .qtag b{color:var(--accent);font-weight:800}
  .qstem{font-size:16px;line-height:1.6;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
  .qpick{border:1px solid var(--pt-line);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.6;font-weight:600;
    background:var(--pt-soft)}
  .ox{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .ox{gap:10px}
  .ox button{appearance:none;height:64px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);
    border-radius:14px;padding:0;font:inherit;font-size:26px;font-weight:800;cursor:pointer;line-height:1}
  .ox button:disabled{opacity:1;cursor:default;color:var(--ink-4)}
  .ox button[data-s="ok"]{border-color:#16B364;color:#16B364;background:color-mix(in srgb,#16B364 10%,#fff)}
  .ox button[data-s="no"]{border-color:#E5322D;color:#E5322D;background:color-mix(in srgb,#E5322D 8%,#fff)}
  .vd{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
  .vd.no{color:var(--no)}
  .vd small{font-size:14px;color:var(--ink-3);font-weight:700}
  .nx{margin-top:12px}
  .res .sr{padding:12px 0;border-top:1px solid var(--line)}
  .res .sr:first-child{border-top:0}
  .res .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .res .sn{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
  .res b{font-size:16px;font-variant-numeric:tabular-nums}
  .res .bar{margin-top:7px}
  .rbox{border:0;box-shadow:0 1px 2px rgba(17,20,25,.05),0 0 0 1px var(--line);border-radius:18px;background:var(--surface);padding:6px 18px 8px;margin-bottom:18px}
</style>
</head><body>
<div class="page">
  <div class="hd"><small id="eb"></small><h1 id="ttl"></h1></div>
  <div class="prog" id="prog"></div>
  <div id="stage"></div>
</div>
<script src="js/gdata.js?v=1111h"></script>
<script src="js/gstore.js?v=1111h"></script>
<script>
(function(){
  GS.내비("", {탭:false});
  var D=GS.D, S=GS.S, e=GS.esc, 기능=(GS.갈래==="기능사");
  var P=new URLSearchParams(location.search), 재진단=P.get("diag")==="1";
  function el(x){return document.getElementById(x);}
  function 날(n){ var d=new Date(); d.setDate(d.getDate()+n); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
  function 표시(v){ return v.replace(/-/g,"."); }
  el("eb").textContent=D.종목+(기능?" · 상시 CBT":"");

  var 일 = S.시작 ? (S.시험일||"") : (기능 ? "" : (D.시험일||""));
  var 분 = S.목표분||GS.기본분;
  var 문제 = [], 번=0, 과목맵={}, 결과=[];
  var 단계 = 재진단 ? "진단" : "시험일";

  function 끝내기(){ if(!S.시작) S.시작=GS.오늘(); GS.저장(); }
  function 건너뛰기(){ S.시험일=일; S.목표분=분; 끝내기(); location.href="index.html"; }

  /* ── 시험일 · 목표일 ── */
  function 일화면(){
    el("ttl").textContent=기능?"목표일":"시험일";
    el("prog").innerHTML="<i class='on'></i><i></i><i></i>";
    var 후=[];
    if(기능){ [30,60,90].forEach(function(n){ 후.push([n+"일",날(n)]); }); }
    else if(D.시험일){ 후.push([표시(D.시험일)+" 예상",D.시험일]); }
    후.push([기능?"없음":"미정",""]);
    el("stage").innerHTML=
      '<div class="tl" id="q">'+후.map(function(c){
        return '<button data-v="'+c[1]+'" aria-pressed="'+(일===c[1])+'">'+c[0]+'</button>';}).join("")+'</div>'+
      '<div class="dr"><input type="date" id="dt" value="'+e(일)+'"></div>'+
      (기능?'':'<details class="sub" style="margin:12px 2px 0"><summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3)">예상 날짜 안내</summary><p id="dnote" style="margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink-3)">'+e(!일?"":(일===D.시험일?"2027년 일정은 공고 전이라 예상 날짜입니다"+(D.시험일근거?" (직전 시험: "+D.시험일근거+")":"")+". 공고가 나오면 직접 바꾸세요.":"직접 고른 날짜"))+'</p></details>')+
      '<div class="gap"></div><button class="b main" id="go">다음</button>';
    document.querySelectorAll("#q button").forEach(function(b){
      b.onclick=function(){ 일=b.dataset.v; 일화면(); };
    });
    el("dt").onchange=function(){ 일=el("dt").value; 일화면(); };
    el("go").onclick=function(){ 단계="목표"; 목표화면(); };
  }
  /* ── 하루 목표 ── */
  function 목표화면(){
    el("ttl").textContent="하루 목표";
    el("prog").innerHTML="<i class='on'></i><i class='on'></i><i></i>";
    el("stage").innerHTML=
      '<div class="tl" id="q">'+GS.분선택.map(function(m){
        return '<button data-m="'+m+'" aria-pressed="'+(분===m)+'">'+GS.분글(m)+'</button>';}).join("")+'</div>'+
      '<div class="gap"></div><button class="b main" id="skip">개념부터 보기</button>'+
      '<button class="lnk" id="go">진단 10문항 먼저 풀기</button>';
    document.querySelectorAll("#q button").forEach(function(b){
      b.onclick=function(){ 분=Number(b.dataset.m); 목표화면(); };
    });
    el("go").onclick=function(){ S.시험일=일; S.목표분=분; GS.저장(); 단계="진단"; 진단시작(); };
    el("skip").onclick=건너뛰기;
  }
  /* ── 진단 10문항 — 과목마다 고르게 ── */
  function 진단시작(){
    문제=GS.진단뽑기(10);
    if(!문제.length){ 끝내기(); location.href="index.html"; return; }
    번=0; 과목맵={}; 결과=[];
    진단그리기();
  }
  function 진단진행(){
    el("prog").innerHTML="<i class='on'></i><i class='on'></i>"+"<span style='display:contents'></span>";
    el("prog").innerHTML=문제.map(function(_,j){
      var r=결과[j]; return '<i class="'+(r?(r.ok?"ok":"no"):(j===번?"now":""))+'"></i>';
    }).join("");
  }
  function 진단그리기(){
    el("ttl").textContent="진단";
    진단진행();
    if(번>=문제.length) return 결과화면();
    var o=문제[번], q=(D.qs[o.q]||{}), t=GS.테마맵[o.k]||{};
    el("stage").innerHTML=
      '<div class="qwrap"><div class="qtag"><b>'+e(t.s||"")+'</b><span>'+(번+1)+' / '+문제.length+'</span></div>'+
        '<p class="qstem">'+e(GS.깨끗(o.s))+'</p><div class="qpick qopt-box">'+e(GS.깨끗(o.c))+'</div></div>'+
      '<div class="ox"><button data-v="1">O</button><button data-v="0">X</button></div><div id="vd"></div>'+
      '<button class="lnk" id="skip">건너뛰기</button>';
    document.querySelectorAll(".ox button").forEach(function(b){
      b.onclick=function(){ 답(Number(b.dataset.v),b); };
    });
    el("skip").onclick=function(){ 번=문제.length; 결과화면(true); };
    var 시작=Date.now(); 진단그리기.시작=시작;
  }
  function 답(v,b){
    var o=문제[번], t=GS.테마맵[o.k]||{}, ok=(v===o.a);
    document.querySelectorAll(".ox button").forEach(function(x){x.disabled=true;});
    b.setAttribute("data-s",ok?"ok":"no");
    if(window.CHEER){ if(ok) CHEER.ok(b); else CHEER.miss(b); }
    GS.기록(o.i,ok,null,Date.now()-(진단그리기.시작||Date.now()));
    var a=과목맵[t.s]=과목맵[t.s]||[0,0]; a[1]++; if(ok) a[0]++;
    결과[번]={ok:ok}; 진단진행();
    el("vd").innerHTML='<div class="vd '+(ok?"":"no")+'">'+(ok?"○ 정답":"✕ 오답")+'<small>정답 '+(o.a?"O":"X")+'</small></div>'+
      '<div class="nx"><button class="b main" id="nx">'+(번+1>=문제.length?"결과":"다음")+'</button></div>';
    el("nx").onclick=function(){ 번++; 진단그리기(); };
  }
  /* ── 결과 — 과목별 정답, 약한 과목, 첫 할 일 ── */
  function 결과화면(건너뜀){
    var 약=Object.keys(과목맵).length?GS.진단결과(과목맵):(끝내기(),[]);
    el("ttl").textContent="진단 결과";
    el("prog").innerHTML="";
    var 줄=Object.keys(과목맵).map(function(s){
      var a=과목맵[s], p=Math.round(a[0]*100/a[1]);
      return '<div class="sr"><div class="t"><span class="sn">'+e(s)+'</span>'+
        (약.indexOf(s)>=0&&Object.keys(과목맵).length>1?'<i class="rl wk">약함</i>':'')+
        '<b>'+a[0]+'/'+a[1]+'</b></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
    }).join("");
    var R=GS.루틴();
    var _n=결과.length, _m=결과.filter(function(r){return r&&r.ok;}).length;
    if(window.ZZ&&!건너뜀&&_n>0){ var _p=_m/_n; ZZ.stars(_p>=1?3:_p>=.7?2:_p>=.4?1:0); }
    el("stage").innerHTML=
      (줄?'<div class="rbox res">'+줄+'</div>':'')+
      /* 진단은 과목 단위다 — 개념 하나하나를 짚은 것이 아니다(2026-10-11 외부 검수 C). 무엇이 바뀌는지 그대로 적는다 */
      '<p style="margin:10px 2px 0;font-size:14px;color:var(--ink-3)">과목별 O·X 10문항으로 본 과목 단위 결과. 가장 약한 과목의 테마부터 오늘 할 일에 올림. 개념별 약점은 풀어 갈수록 테마 정답률로 잡힘</p>'+
      (R.다음?'<a class="b main" id="go" href="'+e(R.다음.주소)+'">'+e(GS.큰단추(R))+'</a>':'<a class="b main" id="go" href="index.html">오늘</a>')+
      '<div class="b2" style="margin-top:10px"><a class="b sm" href="index.html">오늘</a><a class="b sm" href="tree.html">합격 지도</a></div>';
  }

  if(재진단) 진단시작(); else 일화면();
})();
</script>
<script src="https://sarsov11.github.io/terra-learning/beta/beta.js" data-app="gisa" defer></script>
</body></html>
